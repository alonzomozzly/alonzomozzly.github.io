    canNext = (obDraft.name||'').trim().length>0;
  }

  app.innerHTML = `
    <div class="ob-screen">
      <div class="ob-dots">${dots}</div>
      ${step>0?'<button class="ob-back" id="obBack">‹</button>':''}
      ${body}
      <div class="ob-footer"><button class="btn-primary" id="obNext" ${canNext?'':'disabled'}>${step===6?'Начать':'Продолжить'}</button></div>
    </div>`;

  const backBtn = document.getElementById('obBack');
  if(backBtn) backBtn.onclick = ()=>renderOnboarding(step-1);

  if(step===0) app.querySelectorAll('.gender-card').forEach(el=>{ el.onclick = ()=>{ obDraft.gender = el.dataset.g; renderOnboarding(0); }; });
  if(step===1){
    const wheel = document.getElementById('ageWheel');
    const items = wheel.querySelectorAll('.wheel-item');
    const itemH = 40;
    function updateSelection(){
      const idx = Math.max(0, Math.min(items.length-1, Math.round(wheel.scrollTop / itemH)));
      items.forEach((it,i)=> it.classList.toggle('selected', i===idx));
      /* индекс колеса → реальный возраст: выделенное число и записанное значение теперь совпадают */
      obDraft.age = parseInt(items[idx].dataset.v, 10);
    }
    /* Звук барабана аларма iPhone */
    let _lastIdx = -1;
    /* была точная копия drumTick() с созданием AudioContext на каждый тик колеса —
       на быстрой прокрутке браузер упирался в лимит контекстов и звук пропадал */
    const drumClick = drumTick;
    wheel.addEventListener('scroll', ()=>{
      clearTimeout(wheel._t);
      updateSelection();
      const curIdx = Math.round(wheel.scrollTop / itemH);
      if(curIdx !== _lastIdx){ _lastIdx = curIdx; drumClick(); haptic('selection'); }
      wheel._t = setTimeout(()=>{ const idx = Math.round(wheel.scrollTop / itemH); wheel.scrollTo({top: idx*itemH, behavior:'smooth'}); }, 120);
    });
    requestAnimationFrame(()=>{ const idx0 = Math.max(0, Math.min(items.length-1, (obDraft.age||25) - AGE_MIN)); wheel.scrollTop = idx0 * itemH; _lastIdx = idx0; updateSelection(); });
  }
  if(step===2){ const inp = document.getElementById('heightInput'); inp.oninput = ()=>{ obDraft.height = parseInt(inp.value)||null; document.getElementById('obNext').disabled = !(obDraft.height>=100 && obDraft.height<=250); }; }
  if(step===3){ const inp = document.getElementById('weightInput'); inp.oninput = ()=>{ obDraft.weight = parseFloat(String(inp.value).replace(',','.'))||null; document.getElementById('obNext').disabled = !(obDraft.weight>=30 && obDraft.weight<=300); }; }
  if(step===4) app.querySelectorAll('.activity-card').forEach(el=>{ el.onclick = ()=>{ obDraft.activity = el.dataset.a; renderOnboarding(4); }; });
  if(step===5){
    app.querySelectorAll('.goal-card').forEach(el=>{ el.onclick = ()=>{ obDraft.goal = el.dataset.goal; renderOnboarding(5); }; });
    const gi = document.getElementById('goalInfoBtn');
    if(gi) gi.onclick = (e)=>{ e.stopPropagation(); haptic('light'); openModal(`
      <div class="modal-title">Худеть умеренно</div>
      <div class="modal-text">Самый лучший выбор. Умеренный дефицит позволит сбросить вес за адекватный срок и свести риск срывов к минимуму, не навредив здоровью</div>`); };
  }
  if(step===6){ const inp = document.getElementById('nameInput'); inp.oninput = ()=>{ obDraft.name = inp.value; document.getElementById('obNext').disabled = !(inp.value.trim().length>0); }; }

  document.getElementById('obNext').onclick = ()=>{
    if(step<6){ haptic('light'); renderOnboarding(step+1); return; }
    S.profile = {
      gender:obDraft.gender, age:obDraft.age, height:obDraft.height, weight:obDraft.weight,
      activity:obDraft.activity, goal:obDraft.goal, name:obDraft.name.trim(),
      targetWeight: r1(obDraft.weight - (obDraft.gender==='female'?1.5:2.5)),
      calorieAdjust:0, actV2:1
    };
    S.weightLog = [{date:todayStr(), weight:S.profile.weight}];
    save(true);
    haptic('ok');
    renderMain();
  };
}

/* ================= Основной каркас ================= */
const NAV = [
  {t:'home', l:'Главная', i:'home'},
  {t:'food', l:'Питание', i:'food'},
  {t:'activity', l:'Активность', i:'flame'},
  {t:'stats', l:'Аналитика', i:'chart'},
  {t:'settings', l:'Настройки', i:'gear'},
];
const TABS = {}; // заполняется ниже: {html:fn, bind:fn}

function renderMain(){
  ui.tab = ui.tab || 'home';
  app.innerHTML = `
    <div id="mainContent"></div>
    <nav class="bottom-nav" id="bottomNav">
      ${NAV.map(n=>`<button class="nav-item" data-tab="${n.t}">${ic(n.i)}<span class="nav-label">${n.l}</span></button>`).join('')}
    </nav>
    <div class="sheet-overlay" id="sheetOverlay"><div class="sheet" id="sheetContent"></div></div>`;
  document.querySelectorAll('.nav-item').forEach(el=>{ el.onclick = ()=>{
    const to = el.dataset.tab;
    if(ui.tab===to) return;
    haptic('light');
    const ord = NAV.map(n=>n.t);
    const dir = ord.indexOf(to) > ord.indexOf(ui.tab) ? 1 : -1; /* тап по панели едет в ту же сторону, что и свайп */
    ui.tab = to; renderTab(dir);
  }; });
  document.getElementById('sheetOverlay').onclick = (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); };
  renderTab();

  const mc = document.getElementById('mainContent');

  /* ---- Свайпы между разделами: жест 1:1 за пальцем + пружинное завершение (iOS-ощущение).
     Следующий раздел рисуется сразу и едет за пальцем, как в родных приложениях Apple.
     Не трогаем: свайп-удаление продуктов, поля ввода, горизонтальные ленты и колёса */
  const ORDER = NAV.map(n=>n.t);
  const EASE_IOS = 'cubic-bezier(.32,.72,0,1)';
  const G = { mode:null, skip:false, x:0, y:0, dx:0, v:0, lastX:0, lastT:0, w:1, dir:0, edge:false, ghost:null };

  function ghostFor(tabKey){
    const r = mc.getBoundingClientRect();
    const wrap = document.createElement('div');
    wrap.className = 'swipe-ghost';
    wrap.style.cssText = 'position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;overflow:hidden;pointer-events:none;z-index:35;background:var(--bg);will-change:transform;contain:paint;';
    let html = '';
    try{ html = (TABS[tabKey]||TABS.home).html(); }catch(e){ html = ''; }
    /* у копии убираем id и задержки анимаций: она только для глаз */
    const inner = document.createElement('div');
    inner.style.cssText = 'position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;';
    inner.innerHTML = html.replace(/\sid="[^"]*"/g, '').replace(/class="([^"]*)rise([^"]*)"/g, 'class="$1$2"');
    wrap.appendChild(inner);
    document.body.appendChild(wrap);
    return wrap;
  }
  function setPos(dx){
    const off = G.dir===1 ? G.w : -G.w;
    mc.style.transform = 'translate3d(' + dx + 'px,0,0)';
    mc.style.opacity = String(Math.max(0.45, 1 - Math.abs(dx)/(G.w*1.5)));
    if(G.ghost) G.ghost.style.transform = 'translate3d(' + (off + dx) + 'px,0,0)';
  }
  function finishSwipe(commit){
    const off = G.dir===1 ? G.w : -G.w;
    const ghost = G.ghost, dir = G.dir;
    const dur = commit ? 360 : 420;
    window._swipeBusy = true;
    mc.style.transition = 'transform ' + dur + 'ms ' + EASE_IOS + ', opacity ' + dur + 'ms ' + EASE_IOS;
    if(ghost) ghost.style.transition = 'transform ' + dur + 'ms ' + EASE_IOS;
    requestAnimationFrame(()=>{
      mc.style.transform = 'translate3d(' + (commit ? -off : 0) + 'px,0,0)';
      mc.style.opacity = commit ? '0.55' : '1';
      if(ghost) ghost.style.transform = 'translate3d(' + (commit ? 0 : off) + 'px,0,0)';
    });
    if(commit) haptic('light');
    G.ghost = null; G.mode = null; G.dx = 0; G.v = 0;
    setTimeout(()=>{
      mc.style.transition = 'none';
      mc.style.transform = ''; mc.style.opacity = ''; mc.style.willChange = '';
      if(commit){
        const j = ORDER.indexOf(ui.tab) + dir;
        if(j>=0 && j<ORDER.length){ ui.tab = ORDER[j]; renderTab(dir, true); mc.scrollTop = 0; }
      }
      requestAnimationFrame(()=>{
        if(ghost) ghost.remove();
        window._swipeBusy = false;
        setTimeout(()=>{ mc.style.transition = ''; }, 30);
      });
    }, dur + 10);
  }

  mc.addEventListener('touchstart', e=>{
    G.mode = null; G.dx = 0; G.v = 0; G.skip = window._swipeBusy || e.touches.length>1;
    const t = e.touches[0];
    G.x = t.clientX; G.y = t.clientY; G.lastX = t.clientX; G.lastT = Date.now();
    G.w = mc.clientWidth || window.innerWidth || 1;
    let el = e.target;
    while(el && el!==mc){
      if(el.classList && (el.classList.contains('swipe-row') || el.classList.contains('wheel'))){ G.skip = true; break; }
      if(el.tagName && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)){ G.skip = true; break; }
      if(el.scrollWidth > el.clientWidth + 2){ G.skip = true; break; }
      el = el.parentElement;
    }
  }, {passive:true});

  mc.addEventListener('touchmove', e=>{
    if(G.skip || window._swipeBusy) return;
    const t = e.touches[0];
    const dx = t.clientX - G.x, dy = t.clientY - G.y;
    if(G.mode===null){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      G.mode = Math.abs(dx) > Math.abs(dy)*1.15 ? 'h' : 'v';
      if(G.mode==='h'){
        G.dir = dx < 0 ? 1 : -1;
        /* свайп ВПРАВО больше не переключает раздел — он конфликтовал
           с системным жестом «назад» в Telegram */
        if(G.dir===-1){ G.skip = true; G.mode = null; return; }
        const j = ORDER.indexOf(ui.tab) + G.dir;
        G.edge = !(j>=0 && j<ORDER.length);
        mc.style.transition = 'none';
        mc.style.willChange = 'transform, opacity';
        if(!G.edge){ G.ghost = ghostFor(ORDER[j]); G.ghost.style.transition = 'none'; G.ghost.style.transform = 'translate3d(' + (G.dir===1?G.w:-G.w) + 'px,0,0)'; }
      }
    }
    if(G.mode!=='h') return;
    if(e.cancelable) e.preventDefault();
    /* на крайних разделах — мягкая «резинка», как в iOS */
    G.dx = G.edge ? Math.sign(dx) * Math.pow(Math.abs(dx), 0.72) * 1.6 : dx;
    const now = Date.now();
    if(now - G.lastT > 10){ G.v = (t.clientX - G.lastX)/(now - G.lastT); G.lastX = t.clientX; G.lastT = now; }
    setPos(G.dx);
  }, {passive:false});

  const endSwipe = ()=>{
    if(G.mode!=='h'){ G.mode = null; return; }
    const far = Math.abs(G.dx) > G.w*0.26;
    const flick = Math.abs(G.v) > 0.4 && Math.abs(G.dx) > 24 && (G.v < 0) === (G.dir === 1);
    finishSwipe(!G.edge && (far || flick));
  };
  mc.addEventListener('touchend', endSwipe, {passive:true});
  mc.addEventListener('touchcancel', ()=>{ if(G.mode==='h') finishSwipe(false); }, {passive:true});

  /* Pull-to-refresh — пружинное сопротивление без перезагрузки + тянем свежие данные аккаунта */
  let ptr = { startY:0, pulling:false };
  mc.addEventListener('touchstart', e=>{ ptr.startY = mc.scrollTop===0 ? e.touches[0].clientY : 0; ptr.pulling = false; }, {passive:true});
  mc.addEventListener('touchmove', e=>{
    if(!ptr.startY || G.mode==='h' || window._swipeBusy) return;
    const dy = e.touches[0].clientY - ptr.startY;
    if(dy > 8 && mc.scrollTop===0){
      ptr.pulling = true;
      const pull = 70 * (1 - Math.exp(-dy/140)); /* чем дальше тянешь, тем туже — как в iOS */
      mc.style.transition = 'none';
      mc.style.transform = 'translate3d(0,' + pull.toFixed(1) + 'px,0)';
    }
  }, {passive:true});
  mc.addEventListener('touchend', ()=>{
    if(!ptr.pulling){ ptr.startY = 0; return; }
    ptr.pulling = false; ptr.startY = 0;
    mc.style.transition = 'transform .5s ' + EASE_IOS;
    mc.style.transform = '';
    haptic('light');
    if(typeof syncFromCloud==='function') syncFromCloud();
    setTimeout(()=>{ mc.style.transition = ''; }, 520);
  }, {passive:true});
}

function renderTab(dir, noAnim){
  const c = document.getElementById('mainContent');
  if(!c) return; /* основного контейнера нет (экран блокировки доступа/онбординг) — рендерить нечего, избегаем краша на null */
  document.querySelectorAll('.nav-item').forEach(el=> el.classList.toggle('active', el.dataset.tab===ui.tab));
  const bnav = document.getElementById('bottomNav');
  if(bnav) bnav.querySelectorAll('.nav-item').forEach(el=> el.classList.toggle('active', el.dataset.tab===ui.tab));
  const tab = TABS[ui.tab] || TABS.home;
  c.innerHTML = tab.html();
  c.classList.remove('screen-enter','enter-right','enter-left');
  if(!noAnim){ /* после свайпа анимация не нужна — раздел уже приехал за пальцем */
    void c.offsetWidth;
    c.classList.add(dir===1 ? 'enter-right' : dir===-1 ? 'enter-left' : 'screen-enter');
  }
  if(tab.bind) tab.bind();
}

/* умные советы на основе последних дней */
function lastDays(n){
  const arr = [];
  const d = new Date();
  for(let i=0;i<n;i++){ arr.push(todayStr(d)); d.setDate(d.getDate()-1); }
  return arr;
}
function getSmartAdvice(){
  const p = S.profile;
  const ds = todayStr();
  const goal = goalCalories(p);
  const targetProtein = macroTargets(p).protein;
  const days3 = lastDays(4).slice(1).filter(x=>dayItems(x).length>0);
  if(dayItems(ds).length===0 && days3.length===0)
    return `Начни с первого приёма пищи. Цель на день — ${goal} ккал и около ${targetProtein} г белка, чтобы сохранить мышцы на сушке`;
  if(daySalt(ds) > SALT_LIMIT)
    return `Сегодня уже ${daySalt(ds)} г соли — выше границы ${SALT_LIMIT} г. Вечером выбирай пресную еду и пей воду по жажде, иначе завтра будет задержка воды и отёк`;
  if(days3.length>=2){
    const avgP = Math.round(days3.reduce((s,x)=>s+dayMacro(x,'p'),0)/days3.length);
    if(avgP < targetProtein*0.7)
      return `За последние дни белка в среднем ${avgP} г при цели ${targetProtein} г. Добавляй творог, курицу или протеиновый коктейль в каждый приём пищи`;
    const avgDef = Math.round(days3.reduce((s,x)=>s+dayGoalDelta(x),0)/days3.length);
    if(avgDef < -1000)
      return `Средний дефицит за последние дни около ${Math.abs(avgDef)} ккал — это слишком много. Так теряются мышцы и замедляется обмен. Подними калорийность ближе к цели`;
    if(avgDef > 250)
      return `Последние дни в среднем +${avgDef} ккал к норме. Попробуй убрать перекусы после ужина — обычно именно они ломают дефицит`;
  }
  const water = dayWater(ds), norm = waterNormMl();
  if(new Date().getHours()>=16 && water < norm*0.4)
    return `К вечеру выпито только ${(water/1000).toFixed(1)} л из ${(norm/1000).toFixed(1)} л. Равномерно добери норму, но не заливай всё перед сном`;
  const steps3 = lastDays(3).reduce((s,x)=>s+daySteps(x),0)/3;
  if(steps3 < 4000)
    return `Шагов в посление дни маловато. Прогулка 30–40 минут в день заметно ускорит сушку и уберёт отёчность`;
  const si = streakInfo();
  return `Ты на верном пути${si.display>1?` — уже ${si.display}-й день подряд`:''}. Держи белок около ${targetProtein} г, соль до ${SALT_LIMIT} г и не пропускай шаги`;
}

function checkGoalReached(){

  if(!p || !p.targetWeight || !Array.isArray(S.weightLog) || !S.weightLog.length) return;
  const sorted = [...S.weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  const last = sorted[sorted.length-1].weight;
  if(last > p.targetWeight + 1){ if(S.goalShown){ S.goalShown = false; save(); } return; }
  if(last <= p.targetWeight && !S.goalShown){
    S.goalShown = true; save(true);
    showGoalOverlay(last);
  }
}

    </div>`;
}
const WATER_MAX = 10000; // максимум 10 литров
function glassHtml(i, fill){
  const f = Math.max(0, Math.min(1, fill));
  return `<button class="glass ${f>=1?'full':''}" data-act="toggleGlass" data-arg="${i}" aria-label="стакан 250 мл"><i class="glass-fill" style="height:${Math.round(f*100)}%"></i><span class="glass-plus">+</span></button>`;
}
function waterGlassCount(water, norm){
  const base = Math.max(1, Math.ceil(norm/250));
  const grown = Math.floor(Math.min(water, WATER_MAX)/250) + 1; // заполнил последний — появляется новый
  return Math.min(Math.max(base, grown), WATER_MAX/250); // но не больше 40 стаканов (10 л)
}
function waterGlassesHtml(water, norm){
  const count = waterGlassCount(water, norm);
  let out = '';
  for(let i=0;i<count;i++) out += glassHtml(i, (water - i*250)/250);
  return out;
}
function updateWaterCard(){
  const ds = todayStr();
  const water = dayWater(ds), norm = waterNormMl();
  const big = document.getElementById('waterBig');
  if(big){
    const wL = (water/1000).toFixed(water%1000===0?0:1);
    const nL = (norm/1000).toFixed(norm%1000===0?0:1);
    /* красным подсвечиваем перебор относительно НОРМЫ, а не только на максимуме в 10 л:
       текст в «Почему вода» говорит именно про перелив сверх нормы */
    big.classList.toggle('over', water >= WATER_MAX || water > waterNormMl()*1.5);
    big.innerHTML = `<span class="val">${wL} л</span><span class="limit2"> / ${nL} л</span>`;
  }
  const wrap = document.getElementById('waterGlasses');
  if(!wrap) return;
  const count = waterGlassCount(water, norm);
  let glasses = wrap.querySelectorAll('.glass');
  for(let i=glasses.length-1; i>=count; i--) glasses[i].remove(); // лишние пустые убираем
  for(let i=glasses.length; i<count; i++) wrap.insertAdjacentHTML('beforeend', glassHtml(i, (water - i*250)/250)); // новые появляются с анимацией
  wrap.querySelectorAll('.glass').forEach((g,i)=>{
    const fill = Math.max(0, Math.min(1, (water - i*250)/250));
    g.classList.toggle('full', fill>=1);
    g.querySelector('.glass-fill').style.height = Math.round(fill*100)+'%';
  });
}

/* ОДИН общий AudioContext и ОДИН заранее сгенерированный буфер на всё приложение */
let _audioCtx = null, _drumBuf = null;
function drumTick(){
  try{
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!_audioCtx) _audioCtx = new AC();
    if(_audioCtx.state==='suspended') _audioCtx.resume();
    if(!_drumBuf){
      _drumBuf = _audioCtx.createBuffer(1, Math.round(_audioCtx.sampleRate*0.04), _audioCtx.sampleRate);
      const data = _drumBuf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/data.length, 6)*0.25;
    }
    const s = _audioCtx.createBufferSource(); s.buffer = _drumBuf;
    const gain = _audioCtx.createGain();
    gain.gain.setValueAtTime(1, _audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime+0.04);
    s.connect(gain); gain.connect(_audioCtx.destination); s.start();
  }catch(e){}
}

    </div>
    <div class="step-block" id="wqMuscles">
      <div class="field-label">Какие мышцы?</div>
      <div class="pill-row">${MUSCLE_ZONES.map((m,i)=>`<button class="pill" data-m="${i}">${m.n}</button>`).join('')}</div>
    </div>
    <div class="step-block" id="wqDist">
      <div class="field-label">Какая дистанция? (км — если знаешь, посчитаем точнее)</div>

    </div>

      <div class="kcal-preview" id="wPreview"></div>

    </div>`);
  bindWorkoutForm();
};

function setStep(id, on){ const el = document.getElementById(id); if(el) el.classList.toggle('revealed', !!on); }
function syncWorkoutSteps(){
  const a = ACTS[wDraft.act];
  setStep('wqCustom', a.k==='other');
  const okMins = wDraft.mins>0;
  setStep('wqEff', okMins);
  const okEff = okMins && wDraft.eff!==null;
  setStep('wqMuscles', okEff && a.k==='strength');
  setStep('wqDist', okEff && !!a.dist);
  const done = okEff && (a.k!=='strength' || wDraft.muscles.length>0);
  setStep('wqSave', done);
  const el = document.getElementById('wPreview');
  if(el && done) el.textContent = `Примерный расход: ~${workoutKcal()} ккал`;
}
function bindWorkoutForm(){
  const wheel = document.getElementById('actWheel');
  const items = wheel.querySelectorAll('.wheel-item');
  const itemH = 40;
  let _lastIdx = 0;
  function updateSel(){
    const idx = Math.max(0, Math.min(ACTS.length-1, Math.round(wheel.scrollTop/itemH)));
    items.forEach((it,i)=>it.classList.toggle('selected', i===idx));
    wDraft.act = idx;
    syncWorkoutSteps();
  }
  wheel.addEventListener('scroll', ()=>{
    clearTimeout(wheel._t);
    updateSel();
    const cur = Math.round(wheel.scrollTop/itemH);
    if(cur!==_lastIdx){ _lastIdx = cur; drumTick(); haptic('selection'); }
    wheel._t = setTimeout(()=>{ const idx = Math.round(wheel.scrollTop/itemH); wheel.scrollTo({top: idx*itemH, behavior:'smooth'}); }, 120);
  });
  requestAnimationFrame(()=>{ wheel.scrollTop = 0; updateSel(); });
  document.getElementById('wCustom').oninput = (e)=>{ wDraft.custom = e.target.value; };
  document.getElementById('wMins').oninput = (e)=>{ wDraft.mins = parseInt(e.target.value)||null; syncWorkoutSteps(); };
  document.querySelectorAll('.eff-btn').forEach(b=>{ b.onclick = ()=>{
    document.querySelectorAll('.eff-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); wDraft.eff = parseInt(b.dataset.e); haptic('light'); syncWorkoutSteps();
  };});
  document.querySelectorAll('#wqMuscles .pill').forEach(p=>{ p.onclick = ()=>{
    const i = parseInt(p.dataset.m);
    const pos = wDraft.muscles.indexOf(i);
    /* любое количество групп: простое вкл/выкл без взаимоисключения */
    if(pos>=0) wDraft.muscles.splice(pos,1);
    else wDraft.muscles.push(i);
    document.querySelectorAll('#wqMuscles .pill').forEach((x,xi)=>x.classList.toggle('active', wDraft.muscles.includes(xi)));
    haptic('light'); syncWorkoutSteps();
  };});
  document.getElementById('wKm').oninput = (e)=>{ wDraft.km = parseFloat(String(e.target.value).replace(',','.'))||null; syncWorkoutSteps(); };
}
function workoutKcal(){
  const a = ACTS[wDraft.act];
  const w = S.profile.weight, mins = wDraft.mins||0;
  const eff = wDraft.eff===null ? 1 : wDraft.eff;
  /* дистанция даёт самый точный расчёт: ккал/кг/км почти не зависит от темпа */
  if(a.perKm && wDraft.km>0){
    const effAdj = [0.95,1,1.05,1.1][eff];
    return Math.round(a.perKm * w * wDraft.km * effAdj);
  }
  let met = a.met[eff];
  if(a.k==='strength' && wDraft.muscles.length){
    met *= wDraft.muscles.reduce((s,i)=>s+MUSCLE_ZONES[i].f, 0) / wDraft.muscles.length;
  }
  return Math.round(met * 3.5 * w / 200 * mins);
}
ACTIONS.saveWorkout = ()=>{
  const a = ACTS[wDraft.act];
  if(!(wDraft.mins>0) || wDraft.eff===null){ showToast('Заполни все параметры'); return; }
  if(a.k==='strength' && !wDraft.muscles.length){ showToast('Выбери мышечные группы'); return; }
  const label = a.k==='other' ? ((wDraft.custom||'').trim() || 'Тренировка') : a.n;
  const parts = [EFFORTS[wDraft.eff].n.toLowerCase()];
  if(a.k==='strength') parts.push(wDraft.muscles.map(i=>MUSCLE_ZONES[i].n.toLowerCase()).join(', '));
  if(a.dist && wDraft.km>0) parts.push(r1(wDraft.km)+' км');
  const ds = logDs();
  (S.workoutLog[ds] = S.workoutLog[ds]||[]).push({
    kind:a.k, label, mins:wDraft.mins, detail:parts.join(' · '), kcal:workoutKcal(), time:nowTime()
  });
  save(true); haptic('ok');
  openSheet(workoutsHtml());
  renderTab();
};

    if(it.na!=null) it.na = Math.round(it.na*m);

/* ---- свайп влево: дотянул до порога и отпустил — продукт удаляется сам (как в iOS) ---- */
const SWIPE_W = 92;
let swRow=null, swX=0, swY=0, swDx=0, swMode=null, swArmed=false, swSuppress=false, swBusy=false;
function swSet(row, dx, anim){
  const it = row.querySelector('.log-item'), del = row.querySelector('.swipe-del');
  if(!it || !del) return;
  const tr = anim ? 'transform .24s cubic-bezier(.25,.8,.25,1), width .24s cubic-bezier(.25,.8,.25,1)' : 'none';
  it.style.transition = tr; del.style.transition = tr;
  it.style.transform = `translateX(${dx}px)`;
  del.style.transform = `translateX(${Math.max(0, SWIPE_W+dx)}px)`;
  /* плашка растягивается вслед за пальцем, чтобы не оставалось пустоты */
  del.style.width = (SWIPE_W+dx < 0 ? 86 - (SWIPE_W+dx) : 86) + 'px';
}
function swThreshold(row){ return Math.min(row.offsetWidth*0.4, 150); }
function swDelete(row){
  swBusy = true;
  const it = row.querySelector('.log-item');
  const arg = it ? it.dataset.arg : null;
  swSet(row, -row.offsetWidth, true);
  row.style.height = row.offsetHeight + 'px';
  row.offsetHeight; /* reflow */
  row.style.transition = 'height .2s ease .14s, opacity .2s ease .14s';
  row.style.height = '0px';
  row.style.opacity = '0';
  haptic('ok');
  setTimeout(()=>{ swBusy = false; if(arg!=null && ACTIONS.delFood) ACTIONS.delFood(arg); }, 350);
}
document.addEventListener('touchstart', (e)=>{
  if(swBusy){ swRow = null; return; }
  const row = e.target.closest ? e.target.closest('.swipe-row') : null;
  swRow = row; swMode = null; swArmed = false; swSuppress = false;
  if(!row) return;
  const t = e.touches[0];
  swX = t.clientX; swY = t.clientY; swDx = 0;
}, {passive:true});
document.addEventListener('touchmove', (e)=>{
  if(!swRow || swBusy) return;
  const t = e.touches[0];
  const dx = t.clientX - swX, dy = t.clientY - swY;
  if(swMode===null && (Math.abs(dx)>8 || Math.abs(dy)>8)) swMode = Math.abs(dx)>Math.abs(dy) ? 'h' : 'v';
  if(swMode!=='h') return;
  e.preventDefault();
  swDx = Math.min(0, dx);
  swSet(swRow, swDx, false);
  const armed = swDx < -swThreshold(swRow);
  if(armed!==swArmed){
    swArmed = armed;
    haptic('light');
    const del = swRow.querySelector('.swipe-del');
    if(del) del.classList.toggle('armed', armed);
  }
}, {passive:false});
document.addEventListener('touchend', ()=>{
  if(!swRow || swBusy){ swRow = null; swMode = null; return; }
  if(swMode==='h'){
    swSuppress = true;
    if(swArmed) swDelete(swRow);
    else swSet(swRow, 0, true);
  }
  swRow = null; swMode = null;
}, {passive:true});
document.addEventListener('touchcancel', ()=>{
  if(swRow && !swBusy) swSet(swRow, 0, true);
  swRow = null; swMode = null;
}, {passive:true});
document.addEventListener('click', (e)=>{
  if(swSuppress){ swSuppress = false; e.stopPropagation(); e.preventDefault(); }
}, true);

/* ================= Ранжирование как в рекомендациях ================= */
function freqKey(name){ return name.toLowerCase().trim(); }
function bumpFreq(food){
  const key = freqKey(food.name);
  const e = S.foodFreq[key] || {n:0, last:null, food:null};
  e.n++; e.last = todayStr();
  e.food = {name:food.name, emoji:food.emoji||'🍽', per100:food.per100||null, fixed:food.fixed||null};
  S.foodFreq[key] = e;
}
function freqScore(name){
  const e = S.foodFreq[freqKey(name)];
  if(!e) return 0;
  /* у записи может не быть даты (старые/слитые данные) — без гарда был NaN и сортировка ломалась */
  const lastTs = e.last ? new Date(e.last+'T00:00:00').getTime() : NaN;
  const days = isFinite(lastTs) ? Math.max(0, Math.round((Date.now() - lastTs)/86400000)) : 999;
  const recency = days<=1?6 : days<=3?3 : days<=7?1 : 0;
  return e.n*3 + recency;
}
function rankFoods(list){ return [...list].sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0)) || (freqScore(b.name)-freqScore(a.name))); }

let offAbort = 0, offTimer = null;
let pendingCfName = '';

/* ================= Поисковый движок =================
   Задача: находить с полуслова. Раньше требовалось совпадение КАЖДОГО слова запроса
   и результат был бинарным: «грудка курицы» не находило «Куриная грудка».
   Теперь: морфология (курицы/куриный → одна основа), префиксы, опечатки,
   синонимы, латинская раскладка (rehbwf → курица) и транслит (kurica → курица),
   а результаты ранжируются по релевантности, а не отбрасываются целиком. */
const LAYOUT_RU = { q:'й',w:'ц',e:'у',r:'к',t:'е',y:'н',u:'г',i:'ш',o:'щ',p:'з','[':'х',']':'ъ',
  a:'ф',s:'ы',d:'в',f:'а',g:'п',h:'р',j:'о',k:'л',l:'д',';':'ж',"'":'э',
  z:'я',x:'ч',c:'с',v:'м',b:'и',n:'т',m:'ь',',':'б','.':'ю' };
const TRANSLIT_PAIRS = [['shch','щ'],['sch','щ'],['sh','ш'],['ch','ч'],['zh','ж'],['yu','ю'],['ya','я'],['ye','е'],
  ['yo','е'],['ts','ц'],['kh','х'],['ee','и'],['oo','у'],['ck','к'],['a','а'],['b','б'],['v','в'],['g','г'],['d','д'],
  ['e','е'],['z','з'],['i','и'],['j','й'],['k','к'],['l','л'],['m','м'],['n','н'],['o','о'],['p','п'],['r','р'],
  ['s','с'],['t','т'],['u','у'],['f','ф'],['h','х'],['c','к'],['y','ы'],['w','в'],['x','кс'],['q','к']];
function fromLayout(w){ let o=''; for(const ch of w) o += (LAYOUT_RU[ch] || ch); return o; }
function fromTranslit(w){ let o = w; for(const pair of TRANSLIT_PAIRS) o = o.split(pair[0]).join(pair[1]); return o; }
function normFoodStr(x){
  return String(x||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9%.\s-]/g,' ').replace(/\s+/g,' ').trim();
}
function foodTokens(x){ return normFoodStr(x).split(/[^a-zа-я0-9%]+/).filter(Boolean); }
/* Лёгкий стеммер: срезаем русские окончания, чтобы падежи и множественное
   число сходились: курица/курицы/куриная → куриц/курин */
const RU_ENDINGS = ['ами','ями','ого','его','ому','ему','ыми','ими','ая','яя','ое','ее','ые','ие','ый','ий',
  'ой','ей','ом','ем','ах','ях','ов','ев','ам','ям','ую','юю','ья','ье','ьи','а','я','о','е','ы','и','у','ю','ь','й'];
function foodStem(w){
  if(w.length<=3) return w;
  for(const e of RU_ENDINGS){
    if(w.length - e.length >= 3 && w.slice(-e.length)===e) return w.slice(0, w.length-e.length);
  }
  return w;
}
function commonPrefixLen(a,b){ const n=Math.min(a.length,b.length); let i=0; while(i<n && a[i]===b[i]) i++; return i; }
/* расстояние Левенштейна с ранним выходом, когда оно уже больше limit */
function editDistanceWithin(a, b, limit){
  if(Math.abs(a.length-b.length) > limit) return false;
  const m = a.length, n = b.length;
  let prev = new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur = new Array(n+1); cur[0]=i;
    let rowMin = cur[0];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1], prev[j], cur[j-1]);
      if(cur[j]<rowMin) rowMin = cur[j];
    }
    if(rowMin>limit) return false;
    prev = cur;
  }
  return prev[n] <= limit;
}

/* Разбор запроса: каждое слово → набор вариантов (само слово, раскладка, транслит, синонимы) */
function parseQuery(q){
  const list = foodTokens(q);
  const words = list.map(w=>{
    const set = [w];
    const add = x=>{ if(x && x.length>1 && set.indexOf(x)<0) set.push(x); };
    if(/[a-z]/.test(w)){ add(fromLayout(w)); add(fromTranslit(w)); }
    (FOOD_SYN[w]||[]).forEach(add);
    (FOOD_SYN[foodStem(w)]||[]).forEach(add);
    return set.map(v=>({ w:v, s:foodStem(v) }));
  });
  return { words:words, len:list.length };
}
/* оценка одного слова запроса против названия продукта */
function wordScore(v, nameTokens, nameStems){
  const qw = v.w, qs = v.s;
  let best = 0;
  for(let i=0;i<nameTokens.length;i++){
    const nt = nameTokens[i], ns = nameStems[i];
    let sc = 0;
    if(nt===qw) sc = 100;
    else if(nt.indexOf(qw)===0) sc = 94 - Math.min(18, nt.length-qw.length);   // «кур» → «курица»
    else if(qw.indexOf(nt)===0 && nt.length>=3) sc = 82;                        // «гречкой» → «гречка»
    /* важно: короткие токены вроде «г» или «5» не должны совпадать со всем подряд */
    else if(ns.length>=3 && qs.length>=3 && (ns.indexOf(qs)===0 || qs.indexOf(ns)===0)) sc = 80;
    else if(ns.length>=4 && qs.length>=4 && commonPrefixLen(ns,qs) >= 4) sc = 72;  // курин/куриц
    else if(qw.length>=3 && nt.length>=4 && nt.indexOf(qw)>0) sc = 62;             // вхождение в середине
    /* опечатки: в коротких словах — одна, в длинных — две (малако → молоко) */
    else if(qw.length>=4 && nt.length>=4 && editDistanceWithin(qw, nt, qw.length>=6?2:1)) sc = 58;
    else if(qw.length>=4 && nt.length>qw.length+1 && editDistanceWithin(qw, nt.slice(0,qw.length), 1)) sc = 54;
    if(i===0 && sc) sc += 6;   // совпадение в начале названия важнее
    if(sc>best) best = sc;
  }
  return best;
}
function foodScore(food, parsed){
  if(!parsed.len) return 1;
  const nt = foodTokens(food.name);
  if(!nt.length) return 0;
  const ns = nt.map(foodStem);
  let total = 0, matched = 0;
  for(const grp of parsed.words){
    let best = 0;
    for(const v of grp){ const sc = wordScore(v, nt, ns); if(sc>best) best = sc; }
    if(best >= 54){ matched++; total += best; }
  }
  if(!matched) return 0;
  let score = total / matched;
  /* нашли не все слова — показываем, но ниже полных совпадений:
     лучше дать человеку близкие варианты, чем пустой экран */
  if(matched < parsed.len) score *= (0.5 + 0.4 * (matched / parsed.len));
  if(food.pinned && matched === parsed.len) score += 4;
  return score;
}
/* запросы для онлайн-базы: исходный и исправленный (раскладка/транслит) */
function offQueryVariants(q){
  const base = normFoodStr(q);
  if(!base) return [];
  const out = [base];
  if(/[a-z]/.test(base)){
    const lay = base.split(' ').map(fromLayout).join(' ');
    if(lay!==base && /[а-я]/.test(lay)) out.push(lay);
  }
  return out.slice(0,2);
}
function doFoodSearch(q){
  const box = document.getElementById('searchResults');
  if(!box) return;
  q = String(q||'').trim();
  const parsed = parseQuery(q);
  const mine = FOOD_DB.concat(S.customFoods);
  const seen = new Set(mine.map(f=>normFoodStr(f.name)));
  const pool = mine.concat(PUBLIC_FOODS.filter(f=>!seen.has(normFoodStr(f.name))));
  let ranked;
  if(!parsed.len){
    ranked = rankFoods(pool).slice(0,15);
  } else {
    ranked = pool.map(f=>({f:f, s:foodScore(f, parsed)}))
      .filter(x=>x.s>0)
      .sort((a,b)=> (b.s-a.s) || (freqScore(b.f.name)-freqScore(a.f.name)) || a.f.name.length-b.f.name.length)
      .slice(0,40).map(x=>x.f);
  }
  const shown = new Set(ranked.map(f=>normFoodStr(f.name)));
  /* онлайн-база подключается уже со второй буквы, а не с третьей */
  const online = q.length>=2;
  box.innerHTML = (ranked.length
      ? ranked.map(f=>foodResultHtml(f)).join('')
      : (online ? '' : '<div class="empty-hint">Начни писать — найдём с полуслова</div>'))
    + (online ? '<div class="result-source" id="offStatus"><span class="spinner"></span> Ищем в открытой базе…</div><div id="offResults"></div>' : '');
  if(!online) return;
  const my = ++offAbort;
  clearTimeout(offTimer);
  /* небольшая пауза, чтобы не шлать запрос на каждую букву */
  offTimer = setTimeout(()=>{
    if(my!==offAbort) return;
    searchOpenFoodFacts(q).then(list=>{
      if(my!==offAbort) return;
      const st = document.getElementById('offStatus');
      const res = document.getElementById('offResults');
      if(!st || !res) return;
      /* ранжируем онлайн-результаты тем же движком — OFF отдаёт много мусора */
      const scored = list.filter(f=>!shown.has(normFoodStr(f.name)))
        .map(f=>({f:f, s:foodScore(f, parsed)}))
        .sort((a,b)=> b.s-a.s)
        .filter((x,i)=> x.s>0 || i<5)
        .slice(0,12).map(x=>x.f);
      if(!scored.length){
        st.textContent = ranked.length ? 'В открытой базе больше ничего нет' : 'Ничего не нашлось — попробуй короче или добавь своё блюдо';
        return;
      }
      st.textContent = 'Из открытой базы:';
      res.innerHTML = scored.map(f=>foodResultHtml(f)).join('');
    }).catch(()=>{
      const st = document.getElementById('offStatus');
      if(st && my===offAbort) st.textContent = 'Открытая база не ответила — локальные результаты выше работают';
    });
  }, 250);
}

/* выбор граммов и добавление */
let pickedFood = null, pickedGrams = 100;
ACTIONS.pickFood = (arg)=>{
  stopScanner();
  pickedFood = JSON.parse(decodeURIComponent(arg));
  pickedGrams = 100;
  if(pickedFood.fixed && !pickedFood.per100){ addPickedToLog(null); return; }
  openSheet(`
    <div class="sheet-title" style="padding-right:30px">${pickedFood.emoji||'🍽'} ${escapeHtml(pickedFood.name)}</div>
    <div class="field-label">Сколько грамм?</div>
    <div class="gram-pills">${[50,100,150,200,300].map(g=>`<button class="pill ${g===100?'active':''}" data-g="${g}">${g} г</button>`).join('')}</div>
    <input class="plain-input auto-clear" id="gramInput" type="text" inputmode="decimal" placeholder="100" value="100" style="margin-top:10px">
    <div class="kcal-preview" id="gramPreview"></div>
    <button class="btn-primary" style="margin-top:12px" data-act="confirmFood">Добавить</button>`);
  const upd = ()=>{
    const el = document.getElementById('gramPreview');
    const per = pickedFood.per100;
    if(el && per) el.textContent = `${Math.round(per.kcal*pickedGrams/100)} ккал · Б ${Math.round(per.p*pickedGrams/100)} · У ${Math.round(per.c*pickedGrams/100)} · Ж ${Math.round(per.f*pickedGrams/100)}`;
  };
  /* селектор ограничен шторкой: глобальный [data-g] цеплял и карточки пола в онбординге */
  const gScope = document.getElementById('sheetOverlay') || document;
  gScope.querySelectorAll('[data-g]').forEach(p=>{ p.onclick = ()=>{
    gScope.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    pickedGrams = parseInt(p.dataset.g);
    document.getElementById('gramInput').value = pickedGrams;
    haptic('light'); upd();
  };});
  document.getElementById('gramInput').oninput = (e)=>{ pickedGrams = parseFloat(String(e.target.value).replace(',','.'))||0; upd(); };
  upd();
};
ACTIONS.confirmFood = ()=>{ if(!(pickedGrams>0)){ showToast('Введи граммы'); return; } addPickedToLog(pickedGrams); };
function addPickedToLog(grams){
  const f = pickedFood;
  let item;
  if(f.per100 && grams){
    const m = grams/100, per = f.per100;
    item = { name:f.name, emoji:f.emoji||'🍽', time:nowTime(), grams:Math.round(grams),
      kcal:Math.round(per.kcal*m), p:r1(per.p*m), c:r1(per.c*m), f:r1(per.f*m),
      na: per.na!=null? Math.round(per.na*m) : null, k: per.k!=null? Math.round(per.k*m) : null,
      /* храним базу на 100 г — правки граммовки пересчитываются от неё, без накопления оибки округления */
      per100: { kcal:per.kcal, p:per.p, c:per.c, f:per.f, na:per.na!=null?per.na:null, k:per.k!=null?per.k:null } };
  } else {
    const x = f.fixed || f;
    item = { name:f.name, emoji:f.emoji||'🍽', time:nowTime(), kcal:x.kcal, p:x.p||0, c:x.c||0, f:x.f||0, na:x.na!=null?x.na:null, k:x.k!=null?x.k:null };
  }
  const ds = logDs();
  (S.foodLog[ds] = S.foodLog[ds]||[]).push(item);
  bumpFreq(f);
  save(true); haptic('ok');
  /* меню продуктов остаётся открытым — можно сразу добавить следующий */
  openSheet(addFoodHtml()); renderFoodTabBody();
  showToast(`Добавлено: ${item.name} · ${item.kcal} ккал`);
  renderTab();
}

/* ================= Сканер штрихкодов ================= */
let scannerActive = false;
let scanTrack = null, torchOn = false;
let scanStream = null; /* держим ссылку на поток: без неё камера оставалась включённой */
function setupTorch(){
  const btn = document.getElementById('torchBtn');
  if(!btn) return;
  torchOn = false; btn.classList.remove('on');
  let has = false;
  try{ has = !!(scanTrack && scanTrack.getCapabilities && scanTrack.getCapabilities().torch); }catch(e){}
  btn.style.display = has ? 'flex' : 'none';
}
ACTIONS.toggleTorch = ()=>{
  if(!scanTrack) return;
  const btn = document.getElementById('torchBtn');
  const want = !torchOn;
  scanTrack.applyConstraints({ advanced:[{ torch: want }] })
    .then(()=>{ torchOn = want; if(btn) btn.classList.toggle('on', torchOn); haptic('light'); })
    .catch(()=>{ showToast('Фонарик недоступен на этом устройстве'); });
};
function stopScanner(){
  if(scannerActive && window.Quagga){ try{ Quagga.stop(); }catch(e){} }
  scannerActive = false;
  if(scanTrack){ try{ scanTrack.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }
  /* гасим камеру сразу, а не на следующем кадре цикла детектора:
     если вкладка ушла в фон, rAF не вызывался и огонёк камеры горел дальше */
  if(scanStream){ try{ scanStream.getTracks().forEach(t=>t.stop()); }catch(e){} }
  scanStream = null; scanTrack = null; torchOn = false;
}
function loadQuagga(){
  return new Promise((res, rej)=>{
    if(window.Quagga) return res();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function startScanner(){
  const status = document.getElementById('scanStatus');
  const scanBox = document.querySelector('.scan-box');
  if(!scanBox) return;

  /* 1. Пробуем нативный BarcodeDetector API (есть в Chrome/Android/Safari 17+) */
  if('BarcodeDetector' in window){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      const video = document.createElement('video');
      video.srcObject = stream; video.autoplay = true; video.muted = true; video.playsInline = true;
      video.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:20px;';
      /* раньше innerHTML='' стирал рамку и линию прицела — в нативном режиме они пропадали */
      const oldVideo = scanBox.querySelector('video'); if(oldVideo) oldVideo.remove();
      scanBox.insertBefore(video, scanBox.firstChild);
      scannerActive = true;
      scanStream = stream;
      scanTrack = stream.getVideoTracks()[0]; setupTorch();
      const detector = new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'] });
      let lastCode = '', hits = 0;
      const scan = async ()=>{
        if(!scannerActive){ stopScanner(); return; }
        try{
          const codes = await detector.detect(video);
          if(codes.length){
            const code = codes[0].rawValue;
            if(code===lastCode) hits++; else { lastCode = code; hits = 1; }
            if(hits>=2){ stopScanner(); handleBarcode(code); return; }
          }
        }catch(_){}
        requestAnimationFrame(scan);
      };
      await new Promise(r=>video.onloadedmetadata=r);
      if(status) status.textContent = 'Наведи камеру на штрихкод';
      scan();
      return;
    }catch(e){ /* нет разрешения на камеру */ }
  }

  /* 2. Фолбэк: Quagga */
  try{
    await loadQuagga();
    Quagga.init({
      inputStream:{ name:'Live', type:'LiveStream', target:scanBox,
        constraints:{ facingMode:'environment' } },
      decoder:{ readers:['ean_reader','ean_8_reader','upc_reader','code_128_reader'] },
      locate:true
    }, (err)=>{
      if(err){ if(status) status.textContent = 'Камера недоступна — введи код вручную'; return; }
      scannerActive = true;
      Quagga.start();
      try{ scanTrack = (Quagga.CameraAccess && Quagga.CameraAccess.getActiveTrack) ? Quagga.CameraAccess.getActiveTrack() : null; }catch(e){ scanTrack = null; }
      setupTorch();
      if(status) status.textContent = 'Наведи камеру на штрихкод';
      let lastCode = '', hits = 0;
      Quagga.onDetected((data)=>{
        const code = data.codeResult.code;
        if(code===lastCode) hits++; else { lastCode = code; hits = 1; }
        if(hits>=3){ stopScanner(); handleBarcode(code); }
      });
    });
  }catch(e){ if(status) status.textContent = 'Нет доступа к камере — введи код вручную'; }
}
ACTIONS.manualBarcode = ()=>{
  /* люди вводят код с пробелами и дефисами — чистим всё лишнее */
  const raw = (document.getElementById('manualCode')||{}).value || '';

/* ================= Аналитика ================= */
function weightRegression(entries){
  if(entries.length<2) return null;
  const t0 = new Date(entries[0].date+'T00:00:00').getTime();
  const pts = entries.map(e=>({x:(new Date(e.date+'T00:00:00').getTime()-t0)/86400000, y:e.weight}));
  const n = pts.length;
  const sx = pts.reduce((s,p)=>s+p.x,0), sy = pts.reduce((s,p)=>s+p.y,0);
  const sxy = pts.reduce((s,p)=>s+p.x*p.y,0), sxx = pts.reduce((s,p)=>s+p.x*p.x,0);
  const denom = n*sxx - sx*sx;
  if(Math.abs(denom)<1e-9) return null;
  return (n*sxy - sx*sy)/denom; // кг в день
}
function weightChartSvg(entries, slope){
  if(entries.length<2) return '<div class="empty-hint">Нужно минимум две записи веса, чтобы построить график</div>';
  const W=340, H=150, pad=10;
  const target = S.profile.targetWeight;
  const t0 = new Date(entries[0].date+'T00:00:00').getTime();
  const lastT = new Date(entries[entries.length-1].date+'T00:00:00').getTime();
  const spanDays = Math.max((lastT-t0)/86400000, 1);
  const projDays = (slope && slope<0) ? Math.min((entries[entries.length-1].weight - target)/(-slope), 60) : 0;
  const totalDays = spanDays + Math.max(projDays,0);
  let min = Math.min(...entries.map(e=>e.weight), target||99999);
  let max = Math.max(...entries.map(e=>e.weight));
  const range = Math.max(max-min, 1); min -= range*0.12; max += range*0.12;
  const X = d => pad + ((new Date(d+'T00:00:00').getTime()-t0)/86400000)/totalDays*(W-2*pad);
  const Y = w => H-pad - (w-min)/(max-min)*(H-2*pad);
  const line = entries.map((e,i)=>`${i?'L':'M'}${X(e.date).toFixed(1)},${Y(e.weight).toFixed(1)}`).join(' ');
  const lastX = X(entries[entries.length-1].date), lastY = Y(entries[entries.length-1].weight);
  let proj = '';
  if(projDays>0){
    const px = pad + (spanDays+projDays)/totalDays*(W-2*pad);
    const py = Y(entries[entries.length-1].weight + slope*projDays);
    proj = `<line x1="${lastX.toFixed(1)}" y1="${lastY.toFixed(1)}" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>`;
  }
  const goalLine = target? `<line x1="${pad}" y1="${Y(target).toFixed(1)}" x2="${W-pad}" y2="${Y(target).toFixed(1)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="3 4" opacity=".65"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
    ${goalLine}
    <path d="${line}" fill="none" stroke="url(#gradW)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    ${proj}
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="var(--accent-1)"/>
    <defs><linearGradient id="gradW" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--accent-1)"/><stop offset="100%" stop-color="var(--accent-2)"/></linearGradient></defs>
  </svg>`;
}

  <div class="modal-text" style="text-align:left">
    <b>Минимальный</b> — сидячая работа, минимум шагов, тренировок нет (×1.2)<br><br>

    Коэффициент умножается на базовый обмен по формуле Миффлина-Сан Жеора — так считается твоя дневная норма. Норма пересчитывается сразу после выбора. Выбирай честно: завышенный уровень замедлит сушку</div>
  <button class="btn-secondary" style="margin-top:16px" data-act="closeModal">Понятно</button>`);
ACTIONS.setGoal = (arg)=>{ S.profile.goal = arg; save(); renderTab(); };
/* Редактор дневной нормы — одно окно вместо переключателя «Свои КБЖУ».
   Сохранённые цифры живут в profile.custom с on:true — формула их никогда не перезапишет */
ACTIONS.editNorm = ()=>{
  const p = S.profile, c = p.custom || {}, mt = macroTargets(p);
  const row = (id, lbl, val)=>`<div class="field-row"><div class="field-row-lbl">${lbl}</div><input class="field-row-input" id="${id}" type="number" inputmode="numeric" value="${val}"></div>`;
  openModal(`
    <div class="modal-title">Дневная норма</div>
    <div class="card" style="margin-top:6px">
      ${row('nKcal','Калории, ккал', Math.round(c.kcal>0?c.kcal:goalCalories(p)))}
      ${row('nP','Белки, г', Math.round(c.p>0?c.p:mt.protein))}
      ${row('nF','Жиры, г', Math.round(c.f>0?c.f:mt.fat))}
      ${row('nC','Углеводы, г', Math.round(c.c>0?c.c:mt.carbs))}
    </div>
    <button class="btn-primary" style="margin-top:14px" data-act="saveNorm">Сохранить</button>
    <button class="btn-secondary" style="margin-top:8px" data-act="resetNorm">Рассчитать по формуле</button>`);
};
ACTIONS.saveNorm = ()=>{
  const g = id=>{ const el = document.getElementById(id); return Math.round(parseFloat(String(el ? el.value : '').replace(',','.'))); };
  const kcal = g('nKcal'), pr = g('nP'), ff = g('nF'), cc = g('nC');
  if(!(kcal>=600 && kcal<=8000)){ showToast('Калории: от 600 до 8000'); return; }
  if(![pr,ff,cc].every(v=> v>=0 && v<=900)){ showToast('Проверь БЖУ'); return; }
  S.profile.custom = { on:true, kcal:kcal, p:pr, f:ff, c:cc };
  save(true); closeModal(); renderTab(); haptic('ok'); showToast('Норма сохранена');
};
ACTIONS.resetNorm = ()=>{
  S.profile.custom = { on:false };
  save(true); closeModal(); renderTab(); showToast('Норма считается по формуле');
};
ACTIONS.toggleDark = ()=>{ S.theme.dark = !isDark(); save(); applyTheme(); renderTab(); };
ACTIONS.setAccent = (arg)=>{ S.theme.accent = arg; save(); applyTheme(); renderTab(); };


/* ================= Импорт истории (мастер) ================= */
ACTIONS.openImport = ()=>{
  openSheet(`
    <div class="sheet-title">Импорт истории сушки</div>
    <div class="modal-text">Уже какое-то время на сушке? Добавь прошлые дни — прилоение восстановит стрик, графики, средний дефицит и прогноз. Обязательны только калории; вес и БЖУ — по желанию, с ними статистика будет детальнее</div>
    <div class="actions-grid" style="margin-top:14px">
      <button class="btn-primary" data-act="importByDays">Заполнить по дням</button>
      <button class="btn-secondary" data-act="importByText">Вставить текстом (хоть 200 дней)</button>
    </div>`);
};
ACTIONS.importByDays = ()=>{
  openSheet(`
    <div class="sheet-title">Импорт по дням</div>
    <div class="field-label">Сколько дней добавить? (1–200)</div>
    <div class="manual-barcode-row">
      <input class="plain-input" id="impCount" type="number" inputmode="numeric" placeholder="18">
      <button class="btn-secondary" style="width:auto;padding:0 18px" data-act="buildImportRows">Далее</button>
    </div>
    <div id="impRows"></div>`);
};
ACTIONS.buildImportRows = ()=>{
  const n = Math.max(1, Math.min(200, parseInt(document.getElementById('impCount').value)||0));
  if(!n){ showToast('Введи число дней'); return; }
  let rows = '';
  for(let i=1;i<=n;i++){
    const ds = todayStr(new Date(Date.now()-i*86400000));
    rows += `
      <div class="import-day" data-date="${ds}">
        <div class="import-day-title">${fmtDateShort(ds)}${i===1?' · вчера':''}</div>
        <div class="import-row2">
          <input class="plain-input imp-kcal" type="number" inputmode="numeric" placeholder="ккал*">
          <input class="plain-input imp-w" type="text" inputmode="decimal" placeholder="вес">
          <input class="plain-input imp-p" type="number" inputmode="numeric" placeholder="Б">
          <input class="plain-input imp-f" type="number" inputmode="numeric" placeholder="Ж">
          <input class="plain-input imp-c" type="number" inputmode="numeric" placeholder="У">
        </div>
      </div>`;
  }
  document.getElementById('impRows').innerHTML = rows + `<button class="btn-primary" style="margin-top:12px" data-act="applyImportRows">Импортировать</button>`;
};
ACTIONS.applyImportRows = ()=>{
  const days = [];
  document.querySelectorAll('.import-day').forEach(row=>{
    const kcal = parseFloat(row.querySelector('.imp-kcal').value);
    if(!(kcal>0)) return;
    days.push({
      date: row.dataset.date, kcal:Math.round(kcal),
      weight: parseFloat(String(row.querySelector('.imp-w').value).replace(',','.'))||null,
      p: parseFloat(row.querySelector('.imp-p').value)||0,
      f: parseFloat(row.querySelector('.imp-f').value)||0,
      c: parseFloat(row.querySelector('.imp-c').value)||0
    });
  });
  applyImport(days);
};
ACTIONS.importByText = ()=>{
  openSheet(`
    <div class="sheet-title">Импорт текстом</div>
    <div class="modal-text">Каждая строка — один день, сверху самый давний, нижняя строка = вчера.<br>Формат: <b>ккал</b> [вес] [Б Ж У]<br>Пример: «1850 79.4 180 55 160» или просто «1850»</div>
    <textarea class="plain-input" id="impText" rows="9" style="height:auto;padding-top:12px;font-family:inherit" placeholder="1900\n1850 80.1\n1800 79.8 175 50 150"></textarea>
    <div class="kcal-preview" id="impPreview"></div>
    <button class="btn-primary" style="margin-top:12px" data-act="applyImportText">Импортировать</button>`);
  const ta = document.getElementById('impText');
  ta.oninput = ()=>{
    const n = parseImportText(ta.value).length;
    document.getElementById('impPreview').textContent = n? `Распознано дней: ${n}. После импорта сегодня будет ${n+1}-й день подряд` : '';
  };
};
function parseImportText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>/\d/.test(l)).slice(0,200);
  const out = [];
  lines.forEach((line, idx)=>{
    const nums = (line.match(/-?\d+[.,]?\d*/g)||[]).map(x=>parseFloat(x.replace(',','.')));
    if(!nums.length || !(nums[0]>0)) return;
    const daysAgo = lines.length - idx; // нижняя строка = вчера
    out.push({
      date: todayStr(new Date(Date.now()-daysAgo*86400000)),
      kcal: Math.round(nums[0]),
      weight: (nums[1]>=30 && nums[1]<=300)? r1(nums[1]) : null,
      p: nums[2]||0, f: nums[3]||0, c: nums[4]||0
    });
  });
  return out;
}
ACTIONS.applyImportText = ()=>{ applyImport(parseImportText(document.getElementById('impText').value)); };
function applyImport(days){
  if(!days.length){ showToast('Нет ни одного дня с калориями'); return; }
  let added = 0;
  days.forEach(d=>{
    if(!(S.foodLog[d.date]||[]).length){
      S.foodLog[d.date] = [{ name:'Импорт истории', emoji:'📥', time:'12:00', kcal:d.kcal,
        p:d.p, c:d.c, f:d.f, imported:true }]; // na/k не выдумываем — у истории импорта их нет
      added++;
    }
    if(d.weight) upsertWeight(d.date, d.weight);
  });
  save(true); haptic('ok'); closeSheet();
  checkGoalReached(); /* импортированный вес мог уже достичь цели — проверяем сразу */
  const si = streakInfo();
  showToast(`Импортировано дней: ${added}. Сейчас ${si.display}-й день подряд`);
  ui.tab = 'stats'; renderTab();
}

/* ================= Экспорт / восстановление / сброс ================= */
ACTIONS.exportData = ()=>{
  const json = JSON.stringify(S);
  openSheet(`
    <div class="sheet-title">Резервная копия</div>
    <div class="modal-text">Скопируй текст и сохрани в заметках или «Избранном» Telegram. Через «Восстановить из копии» можно вернуть все данные на любом устройстве</div>
    <textarea class="plain-input" id="expText" rows="7" readonly style="height:auto;padding-top:12px;font-size:12px">${escapeHtml(json)}</textarea>
    <button class="btn-primary" style="margin-top:12px" data-act="copyExport">Скопировать</button>`);
};
ACTIONS.copyExport = ()=>{
  const ta = document.getElementById('expText');
  /* iOS Safari не даёт выделить readonly-поле — снимаем флаг на время копирования */
  const wasRO = ta.hasAttribute('readonly');
  if(wasRO) ta.removeAttribute('readonly');
  ta.select(); ta.setSelectionRange(0, 9999999);
  if(wasRO) setTimeout(()=>ta.setAttribute('readonly',''), 0);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>showToast('Скопировано')).catch(()=>showToast('Выдели и скопируй вручную')); }
  else showToast(ok?'Скопировано':'Выдели и скопируй вручную');
  haptic('ok');
};
ACTIONS.openRestore = ()=>{
  openSheet(`
    <div class="sheet-title">Восстановление</div>
    <div class="modal-text">Вставь текст резервной копии. Текущие данные будут заменены</div>
    <textarea class="plain-input" id="restText" rows="7" style="height:auto;padding-top:12px;font-size:12px" placeholder='{"profile":{...}}'></textarea>
    <button class="btn-primary" style="margin-top:12px" data-act="applyRestore">Восстановить</button>`);
};
ACTIONS.applyRestore = ()=>{
  try{
    const data = JSON.parse(document.getElementById('restText').value);
    if(!data || typeof data!=='object' || !data.profile) throw new Error('bad');
    S = Object.assign({ foodLog:{}, weightLog:[], customFoods:[], foodFreq:{}, waterLog:{}, stepsLog:{}, workoutLog:{}, theme:{dark:null,accent:'orange'}, goalShown:false }, data);
    /* в бэкапе могут быть null/битые поля — раньше это роняло тему и рендер */
    normalizeState();
    S.uid = TG_UID || ''; S.stamps = {}; S.tomb = {};
    _snap = null; /* всё содержимое копии получит свежие метки и разойдётся на все устройства */
    save(true); applyTheme(); closeSheet(); haptic('ok');
    showToast('Данные восстановлены');
    ui.tab = 'home'; renderMain();
  }catch(e){ showToast('Не получилось прочитать копию — проверь текст'); }
};
ACTIONS.resetAll = ()=>{
  openModal(`
    <div class="modal-title">Сбросить всё?</div>
    <div class="modal-text">Профиль, история еды, вес и тренировки будут удалены безвозвратно. Сначала сделай резервную копию</div>
    <button class="btn-primary" style="margin-top:14px;background:var(--red)" data-act="confirmReset">Да, удалить всё</button>
    <button class="btn-secondary" style="margin-top:8px" data-act="closeModal">Отмена</button>`);
};
ACTIONS.confirmReset = async ()=>{
  S = { profile:null, foodLog:{}, weightLog:[], customFoods:[], foodFreq:{}, waterLog:{}, stepsLog:{}, workoutLog:{}, theme:{dark:null,accent:'orange'}, goalShown:false, stamps:{}, tomb:{}, uid:TG_UID||'' };
  _snap = null;
  try{ localStorage.removeItem(LS_KEY); localStorage.removeItem('charge_v2'); }catch(e){}
  if(cloudOK){
    const keys = ['cs_meta','cs2_meta','cs2_meta_prev','cs_profile'];
    for(let i=0;i<CS_MAX;i++){ keys.push('cs_'+i); keys.push('csA_'+i); keys.push('csB_'+i); }
    for(let i=0;i<keys.length;i+=50) await csRemoveItems(keys.slice(i,i+50));
    _cloudHadProfile = false; _lastProfileJson = '';
  }
  closeModal(); applyTheme();
  renderOnboarding(0);
};

/* ================= Старт ================= */
init();
})();
</script>
