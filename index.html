<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Charge — трекер сушки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Quagga подгружается лениво только при открытии сканера штрихкодов (loadQuagga), а не на старте (–~300 КБ) -->
<style>

:root{
  --bg:#f4f4f7; --bg-elevated:rgba(255,255,255,.92); --card:#ffffff; --card-2:#eeeef2;
  --text:#17171a; --text-secondary:#8b8b93; --text-tertiary:#c2c2c8; --divider:#ececef;
  --accent-1:#ffc247; --accent-2:#ff8a1e; --accent:#ff9c1a; --accent-soft:#fff3e0; --on-accent:#1a1200;
  --blue:#0a84ff; --pink:#ff2d78; --green:#34c759; --red:#ff3b30;
  --chip:#26262c; --chip-text:#ffffff;
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.45));
  --glass-border:rgba(255,255,255,.65); --glass-inner:rgba(255,255,255,.8);
  --shadow:0 1px 2px rgba(20,20,30,.04), 0 8px 24px rgba(20,20,30,.07);
  --shadow-lg:0 12px 40px rgba(20,20,30,.12);
  --radius:22px; --radius-sm:14px;
  --spring:cubic-bezier(.34,1.45,.5,1); --ease-out:cubic-bezier(.22,1,.36,1); --ios:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
:root.dark{
  --bg:#0a0a0c; --bg-elevated:rgba(20,20,24,.9); --card:#17171b; --card-2:#222228;
  --text:#f5f5f7; --text-secondary:#93939c; --text-tertiary:#55555c; --divider:#26262b;
  --accent-soft:#2b2013;
  --chip:#2c2c33; --chip-text:#ffffff;
  --glass-bg:linear-gradient(135deg,rgba(52,52,62,.55),rgba(28,28,34,.42));
  --glass-border:rgba(255,255,255,.14); --glass-inner:rgba(255,255,255,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
/* Красный акцент с лёгким серебристым отливом */
:root.accent-red{
  --accent-1:#ff6f63; --accent-2:#e0271a; --accent:#f2372a; --accent-soft:#ffe9e7; --on-accent:#ffffff;
}
:root.dark.accent-red{ --accent-soft:#301412; }
:root.accent-red .btn-primary{ box-shadow:0 10px 24px -8px rgba(226,45,32,.5); }
:root.accent-red .action-btn.primary{
  background:linear-gradient(115deg,#ff7a6e 0%, #e8352a 36%, #ffffff 50%, #e8352a 64%, #b31e14 100%);
  background-size:280% 280%; box-shadow:0 10px 26px -8px rgba(226,45,32,.55);
}
/* Зелёная тема */
:root.accent-green{
  --accent-1:#57d96e; --accent-2:#1faa3c; --accent:#2ebd4e; --accent-soft:#e3f8e8; --on-accent:#ffffff;
}
:root.dark.accent-green{ --accent-soft:#0f2a16; }
:root.accent-green .btn-primary{ box-shadow:0 10px 24px -8px rgba(31,170,60,.5); }
:root.accent-green .action-btn.primary{
  background:linear-gradient(115deg,#5fe378 0%, #24b545 36%, #ffffff 50%, #24b545 64%, #158030 100%);
  background-size:280% 280%; box-shadow:0 10px 26px -8px rgba(31,170,60,.55);
}
:root.accent-green .action-btn.primary .action-icon{ color:#fff; }
/* Синяя — монохромная, глубокий сине-стальной оттенок */
:root.accent-blue{
  --accent-1:#5b7db5; --accent-2:#26365c; --accent:#33528f; --accent-soft:#e7edf9; --on-accent:#ffffff;
  --text:#141a26; --text-secondary:#3a4a66; --bg:#f2f4f9; --card:#ffffff;
}
:root.dark.accent-blue{
  --accent-soft:#161c2a; --accent:#8fa8d8; --accent-1:#6f87b8; --accent-2:#a9bcdf;
  --text:#eef2fa; --text-secondary:#8fa0c0; --bg:#090b10; --card:#141824;
}
:root.accent-blue .btn-primary{ box-shadow:0 10px 24px -8px rgba(30,50,90,.5); }
:root.accent-blue .action-btn.primary{
  background:linear-gradient(115deg,#54679a 0%, #26365c 36%, #ffffff 50%, #26365c 64%, #17203a 100%);
  background-size:280% 280%; box-shadow:0 10px 26px -8px rgba(20,32,60,.6);
}
:root.accent-blue .action-btn.primary .action-icon{ color:#fff; }
:root.dark.accent-blue .topbar-streak{ background:rgba(170,190,230,.12); color:#dfe8fa; }

/* Монолит — очень тёмно-серый с серебристым отливом */
:root.accent-mono{
  --accent-1:#5a5e66; --accent-2:#2b2d32; --accent:#3a3d43; --accent-soft:#e9eaee; --on-accent:#ffffff;
  --text:#17171a; --text-secondary:#3a3d43; --bg:#f4f4f7; --card:#ffffff;
}
:root.dark.accent-mono{
  --accent-soft:#232428; --accent:#9aa1ab; --accent-1:#787d86; --accent-2:#b0b5bd;
  --text:#f5f5f7; --text-secondary:#9aa1ab; --bg:#0a0a0c; --card:#17171b;
}
:root.accent-mono .btn-primary{ box-shadow:0 10px 24px -8px rgba(15,17,20,.5); }
:root.accent-mono .action-btn.primary{
  background:linear-gradient(115deg,#54575f 0%, #2a2c31 36%, #ffffff 50%, #2a2c31 64%, #1b1d21 100%);
  background-size:280% 280%; box-shadow:0 10px 26px -8px rgba(15,17,20,.6);
}
:root.accent-mono .action-btn.primary .action-icon{ color:#fff; }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ height:100%; margin:0; }
body{ height:var(--tg-viewport-stable-height, 100%); min-height:0; margin:0; }
body{
  font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro',system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-feature-settings:'kern' 1; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:var(--bg); color:var(--text); overscroll-behavior:none;
  transition:background .4s ease, color .4s ease;
  display:flex; flex-direction:column; align-items:center;
}
#app{
  width:100%; max-width:480px; flex:1;
  display:flex; flex-direction:column;
  min-height:0; /* важно для flex-scroll */
}
#app.appear{ animation:appIn .5s var(--ease-out) both; }
@keyframes appIn{ from{ opacity:0; } to{ opacity:1; } }
#mainContent{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; display:flex; flex-direction:column;
  /* нижняя панель закреплена поверх контента — оставляем под неё место во всех разделах */
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  touch-action:pan-y; backface-visibility:hidden; }
#mainContent > *{ flex-shrink:0; }
#mainContent > .screen{ flex:1 0 auto; }
/* контент всегда на 1px выше контейнера — иначе короткие вкладки не скроллятся и не пружинят внизу */
#mainContent::after{ content:''; flex:0 0 2px; }
#mainContent.enter-right{ animation:slideInRight .42s var(--ios) both; }
#mainContent.enter-left{ animation:slideInLeft .42s var(--ios) both; }
@keyframes slideInRight{ from{ opacity:.3; transform:translate3d(30px,0,0); } to{ opacity:1; transform:none; } }
@keyframes slideInLeft{ from{ opacity:.3; transform:translate3d(-30px,0,0); } to{ opacity:1; transform:none; } }
.swipe-ghost{ border-radius:0; }
button{ font-family:inherit; }
input,textarea,select{ font-family:inherit; }
.hidden{ display:none !important; }

/* ---------- Живые нажатия ---------- */
button, .pressable{ transition:transform .4s var(--spring), box-shadow .4s var(--spring), opacity .2s ease, background .3s ease; touch-action:manipulation; }
html{ overscroll-behavior-x:none; }
body{ overscroll-behavior-y:auto; overscroll-behavior-x:none; }
@media (max-width:520px){
  html.lg .card::after, html.lg .action-btn:not(.primary)::after{ display:none; }
}
button:active, .pressable:active{ transform:scale(.96); transition-duration:.08s; }

/* ---------- (сплэш убран — приложение открывается сразу) ---------- */

/* ---------- Onboarding ---------- */
.ob-screen{ min-height:100vh; display:flex; flex-direction:column; padding:24px 22px 28px; }
.ob-dots{ display:flex; gap:6px; margin-bottom:28px; }
.ob-dot{ height:4px; flex:1; border-radius:4px; background:var(--divider); overflow:hidden; }
.ob-dot i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); transition:width .4s var(--ease-out); }
.ob-back{ width:36px; height:36px; border-radius:50%; border:none; background:var(--card); display:flex; align-items:center; justify-content:center; margin-bottom:18px; color:var(--text); font-size:18px; cursor:pointer; }
.ob-title{ font-size:28px; font-weight:800; letter-spacing:-.02em; margin:6px 0 6px; }
.ob-sub{ font-size:15px; color:var(--text-secondary); margin-bottom:28px; line-height:1.4; }
.ob-body{ flex:1; display:flex; flex-direction:column; }
.ob-footer{ margin-top:auto; padding-top:16px; }
.gender-row{ display:flex; gap:12px; margin-top:8px; }
.gender-card{ flex:1; border-radius:var(--radius); background:var(--card); border:2px solid transparent; padding:26px 16px; text-align:center; cursor:pointer; }
.gender-card.active{ border-color:var(--accent); background:var(--accent-soft); }
.gender-symbol{ font-size:38px; font-weight:700; display:block; margin-bottom:10px; }
.gender-symbol.male{ color:var(--blue); } .gender-symbol.female{ color:var(--pink); }
.gender-label{ font-size:16px; font-weight:600; }
.wheel-wrap{ position:relative; margin:20px 0; height:260px; }
.wheel{ height:260px; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; -ms-overflow-style:none; scrollbar-width:none; }
.wheel::-webkit-scrollbar{ display:none; }
.wheel-pad{ height:110px; }
.wheel-item{ height:40px; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--text-tertiary); scroll-snap-align:center; font-weight:600; transition:.15s; }
.wheel-item.selected{ color:var(--text); font-size:30px; font-weight:800; }
.wheel-frame{ position:absolute; top:110px; left:0; right:0; height:40px; border-top:1.5px solid var(--divider); border-bottom:1.5px solid var(--divider); pointer-events:none; }
.wheel-unit{ text-align:center; color:var(--text-secondary); font-size:14px; margin-top:6px; }
.wheel-acts{ margin:10px 0 4px; }
.wheel-acts .wheel-item{ font-size:16.5px; }
.wheel-acts .wheel-item.selected{ font-size:19px; font-weight:800; }
.eff-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.eff-btn{ border:2px solid transparent; background:var(--card); border-radius:14px; padding:12px 8px; font-size:13.5px; font-weight:700; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; -webkit-tap-highlight-color:transparent; }
.eff-btn .eff-emoji{ font-size:19px; }
.eff-btn.active{ border-color:var(--accent); background:var(--accent-soft); }
.eff-btn:active{ transform:scale(.96); }
.input-field{ width:100%; border:none; background:var(--card); border-radius:var(--radius-sm); padding:20px 18px; font-size:28px; font-weight:800; color:var(--text); text-align:center; outline:none; }
.input-field::placeholder{ color:var(--text-tertiary); font-weight:700; }
.input-hint{ text-align:center; color:var(--text-secondary); font-size:14px; margin-top:12px; }
.activity-list{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
.activity-card{ border-radius:var(--radius); background:var(--card); border:2px solid transparent; padding:16px 18px; cursor:pointer; }
.activity-card.active{ border-color:var(--accent); background:var(--accent-soft); }
.activity-top{ display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; margin-bottom:4px; }
.activity-desc{ font-size:13.5px; color:var(--text-secondary); line-height:1.35; }
.goal-list{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.goal-card{ border-radius:var(--radius); background:var(--card); border:2px solid transparent; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.goal-card.active{ border-color:var(--accent); background:var(--accent-soft); }
.goal-left{ display:flex; align-items:center; gap:12px; }
.goal-radio{ width:20px; height:20px; border-radius:50%; border:2px solid var(--text-tertiary); flex-shrink:0; position:relative; }
.goal-card.active .goal-radio{ border-color:var(--accent); }
.goal-card.active .goal-radio::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
.goal-name{ font-size:15.5px; font-weight:600; }
.goal-kcal{ font-size:14px; font-weight:700; color:var(--text-secondary); }
.goal-card.hot{ position:relative;
  background:linear-gradient(115deg,var(--accent-1) 0%,var(--accent-2) 36%,#ffffff 50%,var(--accent-2) 64%,var(--accent-1) 100%);
  background-size:280% 280%; animation:shimmer 16s ease-in-out infinite;
  box-shadow:0 10px 26px -8px rgba(255,140,20,.5); }
.goal-card.hot .goal-name{ color:var(--on-accent); font-weight:700; }
.goal-card.hot .goal-kcal{ color:var(--on-accent); opacity:.9; }
.goal-card.hot .goal-radio{ border-color:var(--on-accent); opacity:.85; }
.goal-card.hot.active{ border-color:var(--text); }
.goal-card.hot.active .goal-radio{ border-color:var(--on-accent); opacity:1; }
.goal-card.hot.active .goal-radio::after{ background:var(--on-accent); }
.goal-info{ position:absolute; top:-9px; right:-6px; z-index:2; width:22px; height:22px; border-radius:50%; border:2px solid var(--bg); padding:0; background:var(--accent); color:var(--on-accent); font-size:12.5px; font-weight:800; font-style:italic; font-family:Georgia,'Times New Roman',serif; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent; box-shadow:0 3px 10px -2px rgba(0,0,0,.3); }
.goal-info:active{ transform:scale(.9); }

.btn-primary{
  width:100%; border:none; border-radius:18px; padding:18px; font-size:17px; font-weight:700;
  background:linear-gradient(115deg,var(--accent-1),var(--accent-2));
  color:var(--on-accent); cursor:pointer; box-shadow:0 10px 24px -8px rgba(255,140,20,.55);
}
.btn-primary:disabled{ opacity:.35; box-shadow:none; }
.btn-secondary{ width:100%; border:none; border-radius:18px; padding:16px; font-size:16px; font-weight:600; background:var(--card); color:var(--text); cursor:pointer; }
@keyframes shimmer{ 0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; } }

/* ---------- Экраны и переходы ---------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
.topbar-greeting{ font-size:15px; color:var(--text-secondary); font-weight:600; }
.topbar-title{ font-size:22px; font-weight:800; color:var(--text); }
.topbar-streak{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; background:var(--accent-soft); color:var(--accent-2); font-weight:700; font-size:15px; padding:8px 14px; border-radius:16px; text-align:right; }
:root.dark.accent-mono .topbar-streak{ background:rgba(255,255,255,.10); color:#fff; }
:root.dark.accent-mono .streak-main{ color:#fff; }
:root.dark.accent-mono .streak-sub{ color:rgba(255,255,255,.6); }
.streak-main{ font-size:14px; display:flex; align-items:center; gap:5px; }
.streak-fire{ font-size:20px; line-height:1; }
.streak-main{ display:flex; align-items:center; gap:6px; }
.streak-main svg{ width:16px; height:16px; }
.streak-sub{ font-size:11px; font-weight:600; opacity:.7; }
.screen{ padding:6px 20px 10px; }
#mainContent.screen-enter{ animation:screenIn .38s var(--ios) both; }
@keyframes screenIn{ from{ opacity:0; transform:translate3d(0,10px,0); } to{ opacity:1; transform:none; } }
.rise{ animation:riseIn .55s var(--spring) both; }
@keyframes riseIn{ from{ opacity:0; transform:translateY(16px) scale(.97); } to{ opacity:1; transform:none; } }

.ring-wrap{ display:flex; flex-direction:column; align-items:center; padding:14px 0 6px; }
.ring-label{ font-size:14px; color:var(--text-secondary); font-weight:600; margin-bottom:14px; }
.ring-svg-holder{ position:relative; width:230px; height:230px; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-kcal{ font-size:44px; font-weight:900; letter-spacing:-.03em; }
.ring-kcal-unit{ font-size:14px; color:var(--text-secondary); font-weight:700; margin-top:2px; }
.ring-sub{ font-size:13.5px; color:var(--text-secondary); margin-top:14px; text-align:center; max-width:280px; line-height:1.4; }
.ring-burn{ margin-top:8px; font-size:12.5px; font-weight:700; color:var(--green); }
.macros-row{ display:flex; gap:10px; margin-top:18px; }
.macro-pill{ flex:1; background:var(--card); border-radius:16px; padding:12px 10px; text-align:center; box-shadow:var(--shadow); }
.macro-val{ font-size:16px; font-weight:800; }
.macro-goal{ font-size:12px; font-weight:600; color:var(--text); opacity:.45; }
.macro-lbl{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; font-weight:600; }

/* ---------- Карточка калорий (главный экран) ---------- */
.kcal-card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 14px 18px; margin-top:4px; }
.kcal-card-row{ display:flex; align-items:center; justify-content:space-between; gap:2px; }
.kcal-side{ flex:0 0 70px; text-align:center; }
.kcal-side-val{ font-size:19px; font-weight:800; letter-spacing:-.02em; }
.kcal-side-lbl{ font-size:11.5px; color:var(--text-secondary); font-weight:600; margin-top:3px; }
.kcal-side.burn .kcal-side-val{ color:var(--green); }
.kcal-gauge{ position:relative; width:172px; height:172px; flex-shrink:0; }
.kcal-gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.kcal-gauge-val{ font-size:36px; font-weight:900; letter-spacing:-.03em; line-height:1; }
.kcal-gauge-lbl{ font-size:12px; color:var(--text-secondary); font-weight:600; margin-top:7px; text-align:center; max-width:104px; line-height:1.25; }
.kcal-card-foot{ display:flex; align-items:center; justify-content:center; gap:5px; margin-top:14px; font-size:12.5px; color:var(--text-secondary); font-weight:600; text-align:center; }

/* ---------- Полосы БЖУ ---------- */
:root{ --macro-carbs:#ffab3d; --macro-protein:#ff5470; --macro-fat:#4c9eff; }
:root.dark{ --macro-carbs:#ffb85c; --macro-protein:#ff7086; --macro-fat:#5aa8ff; }
.macro-bars{ display:flex; gap:10px; margin-top:14px; }
.macro-bar{ flex:1; background:var(--card); border-radius:16px; padding:13px 11px 13px; box-shadow:var(--shadow); min-width:0; }
.macro-bar-head{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.macro-bar-ic{ font-size:13px; line-height:1; flex-shrink:0; }
.macro-bar-track{ height:6px; border-radius:6px; background:var(--card-2); overflow:hidden; }
.macro-bar-fill{ height:100%; border-radius:6px; transition:width .7s var(--ease-out); }
.macro-bar-nums{ margin-top:9px; font-size:12.5px; font-weight:700; white-space:nowrap; }
.macro-bar-nums span{ color:var(--text-secondary); font-weight:600; }
.topbar-date{ font-size:12.5px; color:var(--text-tertiary); font-weight:600; margin-top:2px; }
.protein-hint{ margin-top:10px; text-align:center; font-size:13px; font-weight:700; }

.actions-grid{ display:flex; flex-direction:column; gap:12px; margin-top:20px; }
.action-btn{ display:flex; align-items:center; gap:14px; border:none; border-radius:20px; padding:17px 18px; background:var(--card); cursor:pointer; text-align:left; width:100%; box-shadow:var(--shadow); }
.action-btn.primary{
  background:linear-gradient(115deg,var(--accent-1) 0%,var(--accent-2) 36%,#ffffff 50%,var(--accent-2) 64%,var(--accent-1) 100%);
  background-size:280% 280%; animation:shimmer 16s ease-in-out infinite;
  box-shadow:0 10px 26px -8px rgba(255,140,20,.5);
}
.action-icon{ width:44px; height:44px; border-radius:14px; background:var(--chip); color:var(--chip-text); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.action-icon svg{ width:22px; height:22px; }
.action-btn.primary .action-icon{ background:rgba(255,255,255,.28); color:var(--on-accent); }
:root.accent-red .action-btn.primary .action-icon{ color:#fff; }
.action-title{ font-size:15.5px; font-weight:700; color:var(--text); }
.action-btn.primary .action-title{ color:var(--on-accent); }
.action-sub{ font-size:12.5px; color:var(--text-secondary); margin-top:1px; }
.action-btn.primary .action-sub{ color:var(--on-accent); opacity:.65; }
.action-chevron{ margin-left:auto; color:var(--text-tertiary); font-size:16px; }

.advice-card{ margin-top:20px; border-radius:var(--radius); background:var(--card); padding:18px; box-shadow:var(--shadow); }
.advice-head{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; }
.advice-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulseDot 2.4s ease-in-out infinite; }
.act-quote{ color:inherit !important; }
@keyframes pulseDot{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.5; transform:scale(.82);} }
.advice-text{ font-size:15px; line-height:1.45; font-weight:600; }
.warn-card{ margin-top:12px; border-radius:18px; padding:14px 16px; background:var(--accent-soft); color:var(--accent-2); font-size:13.5px; font-weight:700; line-height:1.45; display:flex; align-items:flex-start; gap:12px; }
.warn-ic{ width:24px; height:24px; border-radius:50%; border:2px solid currentColor; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; line-height:1; margin-top:1px; }
.warn-card.red{ background:rgba(255,59,48,.1); color:var(--red); }

.section-title{ font-size:20px; font-weight:800; margin:18px 0 12px; letter-spacing:-.01em; }
.card{ background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); position:relative; }
.card + .card{ margin-top:12px; }
.log-item{ cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--divider); }
.log-item:last-child{ border-bottom:none; }
.log-emoji{ width:38px; height:38px; border-radius:12px; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.log-name{ font-size:14.5px; font-weight:600; }
.log-meta{ font-size:12px; color:var(--text-secondary); margin-top:1px; }
.log-grams{ font-weight:700; font-size:.92em; opacity:.95; }
.log-kcal-wrap{ display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; flex-shrink:0; }
.log-kcal-unit{ font-size:10.5px; color:var(--text-secondary); font-weight:700; margin-top:1px; }
.log-kcal{ margin-left:auto; font-size:14.5px; font-weight:700; white-space:nowrap; }
.log-del{ border:none; background:none; color:var(--text-tertiary); font-size:15px; padding:6px; cursor:pointer; }
.empty-hint{ text-align:center; color:var(--text-secondary); font-size:13.5px; padding:20px 10px; line-height:1.5; }

/* ---------- Контроль отёков ---------- */
.metric-card{ position:relative; border-radius:22px; padding:18px; color:#fff; overflow:hidden;
  background:linear-gradient(150deg,#23242b 0%,#121317 70%); border:1px solid rgba(255,255,255,.08);
  box-shadow:var(--shadow); cursor:default; }
.metric-card::before{ content:''; position:absolute; inset:0; background:radial-gradient(420px 200px at var(--mx,80%) -20%, rgba(255,255,255,.10), transparent 60%); pointer-events:none; }
.metric-card + .metric-card{ margin-top:12px; }
.metric-lbl{ font-size:13.5px; font-weight:700; color:rgba(255,255,255,.6); }
.metric-big{ font-size:34px; font-weight:900; margin-top:6px; letter-spacing:-.02em; }
.metric-big .val{ color:#fff; } .metric-big.over .val{ color:#ff6157; }
.metric-big .limit{ color:#ff6157; font-size:24px; font-weight:800; }
.metric-big .unit2{ color:rgba(255,255,255,.5); font-size:22px; font-weight:800; }
.metric-note{ font-size:12.5px; line-height:1.5; color:rgba(255,255,255,.62); margin-top:10px; }
.metric-note b{ color:#fff; }
.info-dot{ position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; border:none; background:rgba(150,150,160,.3); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; }
.info-dot svg{ width:15px; height:15px; }
.metric-bar{ height:8px; border-radius:6px; background:rgba(255,255,255,.14); margin-top:12px; overflow:hidden; }
.metric-bar i{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); transition:width .8s var(--ease-out); }
.metric-bar.watery i{ background:linear-gradient(90deg,#6fc4ff,#0a84ff); }
.metric-bar.danger i{ background:linear-gradient(90deg,#ff8a80,#ff3b30); }
.water-glasses{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.glass{ position:relative; width:30px; height:42px; border:none; padding:0; cursor:pointer; background:rgba(255,255,255,.13); clip-path:polygon(4% 0, 96% 0, 84% 100%, 16% 100%); overflow:hidden; -webkit-tap-highlight-color:transparent; }
.glass-fill{ position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(180deg,#6fc4ff,#0a84ff); transition:height .7s var(--ease-out); }
.glass-plus{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:rgba(255,255,255,.7); transition:opacity .35s ease; }
.glass.full .glass-plus{ opacity:0; }
.glass:active{ transform:scale(.92); transition:transform .15s ease; }
@keyframes glassPop{ from{ transform:scale(.4); opacity:0; } }
.glass{ animation:glassPop .35s var(--spring) backwards; }
.nk-grid{ display:flex; gap:10px; margin-top:14px; }
.nk-cell{ flex:1; background:rgba(255,255,255,.07); border-radius:14px; padding:12px; }
.nk-cell-lbl{ font-size:11px; font-weight:700; color:rgba(255,255,255,.55); }
.nk-cell-val{ font-size:17px; font-weight:800; margin-top:3px; }
.nk-ratio-badge{ display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:7px 10px; border-radius:12px; font-size:12px; font-weight:800; background:rgba(255,255,255,.1); white-space:nowrap; }
.nk-ratio-badge.good{ color:#7be08a; } .nk-ratio-badge.mid{ color:#ffd166; } .nk-ratio-badge.bad{ color:#ff8a80; }

/* ---------- Активность ---------- */
.lock-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; padding:40px 28px; text-align:center; gap:14px; }
.lock-logo{ font-size:54px; margin-bottom:4px; }
.lock-reason{ font-size:11px; color:var(--text-secondary); opacity:.55; margin-top:8px; }
/* grid-auto-rows:1fr — чтобы карточка «Тренировки» была ровно той же высоты, что и шаги */
.act-hero{ display:grid; grid-template-columns:1.25fr 1fr; grid-auto-rows:1fr; gap:14px; align-items:stretch; margin-top:8px; }
.steps-card{ flex:1.25; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.train-card{ flex:1; align-self:stretch; height:100%; min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; cursor:pointer; border:none; margin:0; color:var(--text); }
.train-icon{ width:54px; height:54px; border-radius:18px; background:var(--chip); color:var(--chip-text); display:flex; align-items:center; justify-content:center; }
.train-icon svg{ width:26px; height:26px; }
.steps-ring-holder{ position:relative; width:148px; height:148px; margin:0 auto; }
.steps-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.steps-num{ font-size:24px; font-weight:900; letter-spacing:-.02em; }
.steps-lbl{ font-size:11px; color:var(--text-secondary); font-weight:700; }
.act-quote{ margin-top:16px; border-radius:18px; padding:16px; background:var(--accent-soft); color:var(--accent-2); font-size:13.5px; font-weight:700; line-height:1.5; text-align:center; }
.workout-item{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--divider); }
.workout-item:last-child{ border-bottom:none; }
.workout-kcal{ margin-left:auto; text-align:right; }
.workout-kcal-lbl{ font-size:10.5px; color:var(--text-secondary); font-weight:700; }
.workout-kcal-val{ font-size:16px; font-weight:900; }
.empty-mid{ text-align:center; font-size:16px; font-weight:700; color:var(--text-secondary); padding:34px 10px 26px; }
.step-block{ overflow:hidden; max-height:0; opacity:0; transition:max-height .5s var(--ease-out), opacity .4s ease, margin .4s ease; margin-top:0; }
/* max-height был 400px при overflow:hidden — ряды мышечных групп, не влезшие в эту
   высоту, обрезались и по ним нельзя было попасть пальцем */
.step-block.revealed{ max-height:1400px; opacity:1; margin-top:14px; }
@keyframes caretBlink{ 0%,45%{opacity:1} 55%,100%{opacity:0} }
input.plain-input, textarea.plain-input, .plain-input, .search-input, .input-field{
  caret-color:var(--accent); animation:none;
}
input:focus.plain-input, textarea:focus.plain-input, .search-input:focus, .input-field:focus{ caret-color:var(--accent); }
input[type=range].hard-slider{ -webkit-appearance:none; width:100%; height:8px; border-radius:6px; background:linear-gradient(90deg,var(--green),var(--accent-2),var(--red)); outline:none; margin:14px 0 4px; }
input[type=range].hard-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid rgba(0,0,0,.08); box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer; }
.slider-caption{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-secondary); font-weight:600; }

/* ---------- Аналитика ---------- */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.stat-card{ background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); }
.stat-val{ font-size:22px; font-weight:800; letter-spacing:-.01em; }
.stat-lbl{ font-size:12px; color:var(--text-secondary); margin-top:3px; font-weight:600; }
.forecast-card{ margin-top:14px; text-align:center; padding:20px 18px; }
.forecast-num{ font-size:28px; font-weight:900; letter-spacing:-.02em; }
.forecast-lbl{ font-size:13px; color:var(--text-secondary); font-weight:600; margin-top:4px; line-height:1.4; }
.calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px; }
.cal-cell{ aspect-ratio:1/1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--card-2); color:var(--text-tertiary); }
.cal-cell.ok{ background:rgba(52,199,89,.18); color:var(--green); }
.cal-cell.warn{ background:rgba(255,156,26,.18); color:var(--accent-2); }
.cal-cell.bad{ background:rgba(255,59,48,.16); color:var(--red); }
.cal-cell.frozen{ background:rgba(10,132,255,.15); color:var(--blue); }
.cal-cell.today{ outline:2px solid var(--accent); }
.cal-legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; font-size:11px; color:var(--text-secondary); font-weight:600; }
.cal-legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-1px; }
.weight-hero{ text-align:center; padding:14px 0 4px; }
.weight-hero-lbl{ font-size:14px; color:var(--text-secondary); font-weight:600; }
.weight-hero-val{ font-size:42px; font-weight:900; margin-top:4px; letter-spacing:-.02em; }
.weight-trend{ margin-top:12px; background:var(--accent-soft); color:var(--accent-2); font-weight:700; font-size:13.5px; padding:12px 16px; border-radius:16px; text-align:center; line-height:1.4; }
.chart-holder{ margin-top:14px; }
.log-weight-btn{ width:100%; border:none; border-radius:18px; padding:16px; font-size:15.5px; font-weight:700; background:var(--card); color:var(--text); margin-top:14px; cursor:pointer; box-shadow:var(--shadow); }

/* ---------- Нижняя навигация ---------- */
.bottom-nav{
  /* закреплена внизу во ВСЕХ разделах, не уезжает со скроллом */
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  background:var(--bg-elevated); border-top:1px solid var(--divider);
  display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:60;
}
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:none; background:none; padding:7px 0; cursor:pointer; color:var(--text-tertiary); }
.nav-item svg{ width:23px; height:23px; transition:transform .45s var(--spring); }
.nav-item.active{ color:var(--accent-2); }
.nav-item.active svg{ transform:translateY(-2px) scale(1.12); }
.nav-label{ font-size:10px; font-weight:700; }

/* ---------- Liquid Glass (прогрессивно) ---------- */
html.lg .card, html.lg .stat-card, html.lg .macro-pill, html.lg .action-btn:not(.primary), html.lg .advice-card, html.lg .log-weight-btn, html.lg .btn-secondary{
  background:var(--glass-bg); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-border); box-shadow:inset 0 1px 0 var(--glass-inner), var(--shadow);
}
html.lg .bottom-nav{ background:var(--glass-bg); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); border-top:1px solid var(--glass-border); }
html.lg .sheet{ background:var(--bg); border:none; }
@media (hover: hover) and (pointer: fine) {
  html.lg .card::after, html.lg .action-btn:not(.primary)::after{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(300px 140px at var(--mx,75%) var(--my,-30%), rgba(255,255,255,.16), transparent 65%);
    opacity:var(--glow-op,0); transition:opacity .5s ease;
  }
  html.lg .card:hover::after, html.lg .action-btn:not(.primary):hover::after{ --glow-op:1; }
}
html.lg .action-btn, html.lg .card{ position:relative; overflow:hidden; }
html.lg body{ background:
  radial-gradient(900px 500px at 110% -10%, rgba(255,156,26,.10), transparent 60%),
  radial-gradient(700px 460px at -20% 110%, rgba(10,132,255,.08), transparent 60%), var(--bg); background-attachment:fixed; }
html.lg.accent-red body{ background:
  radial-gradient(900px 500px at 110% -10%, rgba(242,55,42,.10), transparent 60%),
  radial-gradient(700px 460px at -20% 110%, rgba(180,190,205,.10), transparent 60%), var(--bg); background-attachment:fixed; }
html.lg.accent-green body{ background:
  radial-gradient(900px 500px at 110% -10%, rgba(46,189,78,.10), transparent 60%),
  radial-gradient(700px 460px at -20% 110%, rgba(10,132,255,.06), transparent 60%), var(--bg); background-attachment:fixed; }
html.lg.accent-blue body{ background:
  radial-gradient(900px 500px at 110% -10%, rgba(51,82,143,.10), transparent 60%),
  radial-gradient(700px 460px at -20% 110%, rgba(51,82,143,.06), transparent 60%), var(--bg); background-attachment:fixed; }
html.lg.accent-blue.dark body{ background:
  radial-gradient(900px 500px at 110% -10%, rgba(22,30,48,.60), transparent 60%), var(--bg); background-attachment:fixed; }
html.lg.accent-mono body{ background:
  radial-gradient(900px 500px at 110% -10%, rgba(90,94,102,.08), transparent 60%),
  radial-gradient(700px 460px at -20% 110%, rgba(90,94,102,.05), transparent 60%), var(--bg); background-attachment:fixed; }
html.lg.accent-mono.dark body{ background:
  radial-gradient(900px 500px at 110% -10%, rgba(30,32,36,.60), transparent 60%), var(--bg); background-attachment:fixed; }

/* ---------- Sheet ---------- */
.sheet-overlay{ position:fixed; inset:0; background:rgba(8,8,12,.5); z-index:100; display:flex; align-items:stretch; opacity:0; pointer-events:none; transition:opacity .3s ease; }
html.lg .sheet-overlay{ backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.sheet-overlay.open{ opacity:1; pointer-events:auto; }
.sheet{ background:var(--bg); width:100%; max-width:560px; margin:0 auto; border-radius:0; height:100vh; height:100dvh; max-height:none; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; transform:translateY(100%); transition:transform .45s var(--ease-out); padding:calc(16px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); position:relative; }
.sheet-overlay.open .sheet{ transform:translateY(0); }
.sheet-handle{ width:38px; height:5px; background:var(--divider); border-radius:6px; margin:0 auto 14px; }
.sheet-title{ font-size:19px; font-weight:800; margin-bottom:14px; padding-right:36px; }
.sheet-close{ position:sticky; top:0; float:right; width:36px; height:36px; border-radius:50%; background:var(--card); border:none; color:var(--text-secondary); font-size:16px; cursor:pointer; z-index:5; box-shadow:var(--shadow); }
html.no-scroll, html.no-scroll body{ overflow:hidden; height:100%; }
.modal-overlay{ position:fixed; inset:0; background:rgba(8,8,12,.55); z-index:120; display:flex; align-items:center; justify-content:center; padding:28px; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.modal-overlay.open{ opacity:1; pointer-events:auto; }
.modal{ background:var(--card); border-radius:22px; padding:22px; max-width:340px; width:100%; transform:scale(.9); transition:transform .45s var(--spring); box-shadow:var(--shadow-lg); }
html.lg .modal{ background:var(--glass-bg); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); border:1px solid var(--glass-border); }
.modal-overlay.open .modal{ transform:scale(1); }
.modal-title{ font-size:16.5px; font-weight:800; margin-bottom:10px; }
.modal-text{ font-size:14px; line-height:1.55; color:var(--text); }
.modal-text + .modal-text{ margin-top:10px; }

/* ---------- Еда ---------- */
.search-input{ width:100%; border:none; background:var(--card); border-radius:14px; padding:14px 16px; font-size:16px; color:var(--text); outline:none; margin-bottom:14px; box-shadow:var(--shadow); }
.food-tabs{ display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none; }
.food-tabs::-webkit-scrollbar{ display:none; }
.food-tab{ border:none; background:var(--card); padding:9px 15px; border-radius:14px; font-size:13.5px; font-weight:700; color:var(--text-secondary); white-space:nowrap; cursor:pointer; }
.food-tab.active{ background:var(--accent); color:var(--on-accent); }
.food-result{ position:relative; display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:none; background:var(--card); box-shadow:var(--shadow); padding:12px 14px; margin-bottom:8px; border-radius:16px; cursor:pointer; color:var(--text); }
.pub-badge{ position:absolute; top:6px; right:9px; font-size:8.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:linear-gradient(135deg,var(--accent-1),var(--accent-2)); padding:2px 6px; border-radius:7px; pointer-events:none; }
.food-result:active{ transform:scale(.98); }
.food-r-emoji{ width:40px; height:40px; border-radius:12px; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
.food-r-info{ flex:1; min-width:0; }
.food-r-name{ font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.food-r-meta{ font-size:12px; color:var(--text-secondary); margin-top:1px; }
.food-r-kcal{ margin-left:auto; font-size:13.5px; font-weight:700; color:var(--text-secondary); white-space:nowrap; }
.field-label{ font-size:13px; font-weight:700; color:var(--text-secondary); margin:14px 0 6px; }
.plain-input{ width:100%; border:none; background:var(--card); border-radius:14px; padding:14px 16px; font-size:16px; color:var(--text); outline:none; box-shadow:var(--shadow); }
textarea.plain-input{ min-height:120px; resize:vertical; line-height:1.5; }
.pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.pill{ border:2px solid transparent; background:var(--card); padding:9px 14px; border-radius:12px; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--text); }
.pill.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-2); }
.gram-pills{ display:flex; gap:8px; margin-top:10px; }
.result-source{ font-size:11px; color:var(--text-tertiary); text-align:center; margin:2px 0 10px; }
.spinner{ width:20px; height:20px; border-radius:50%; border:2.5px solid var(--divider); border-top-color:var(--accent-2); animation:spin .7s linear infinite; margin:16px auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* сканер */
.scan-box{ aspect-ratio:1/1; border-radius:24px; background:#0c0c0e; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; margin-bottom:14px; }
.scan-box video,.scan-box canvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.scan-frame{ width:70%; height:45%; border:3px solid var(--accent); border-radius:18px; box-shadow:0 0 0 999px rgba(0,0,0,.4); position:relative; z-index:2; }
.scan-line{ position:absolute; left:6%; right:6%; height:2px; background:var(--accent); box-shadow:0 0 10px var(--accent); animation:scanmove 1.6s ease-in-out infinite; }
@keyframes scanmove{ 0%{ top:8%; } 50%{ top:88%; } 100%{ top:8%; } }
.scan-status{ color:#fff; font-size:12.5px; text-align:center; position:absolute; bottom:10px; left:10px; right:10px; z-index:3; opacity:.85; }
.manual-barcode-row{ display:flex; gap:8px; margin-top:14px; }
.manual-barcode-row .plain-input{ flex:1; }
.manual-barcode-row button{ border:none; background:var(--accent); color:var(--on-accent); font-weight:700; padding:0 18px; border-radius:14px; cursor:pointer; }

/* ---------- Настройки ---------- */
.settings-tabs{ display:flex; gap:8px; margin:4px 0 18px; }
.settings-tab{ flex:1; border:none; background:var(--card); padding:11px 4px; border-radius:14px; font-size:13px; font-weight:700; color:var(--text-secondary); cursor:pointer; }
.settings-tab.active{ background:var(--accent); color:var(--on-accent); }

<div id="app"></div>

<script>
(function(){
"use strict";

/* ================= Telegram + среда ================= */
/* реальный Telegram определяем по документрованному WebApp.platform (не по несуществующему initDataUnavailable) */
const _WA = window.Telegram && window.Telegram.WebApp;
const tg = (_WA && _WA.platform && _WA.platform !== 'unknown') ? _WA : null;
let cloudOK = false;
if(tg){
  try{
    tg.ready(); tg.expand();
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if(tg.setHeaderColor) tg.setHeaderColor('#000000');
    cloudOK = !!(tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  }catch(e){}
}
function haptic(kind){
  try{
    if(!tg || !tg.HapticFeedback) return;
    if(kind==='ok') tg.HapticFeedback.notificationOccurred('success');
    else if(kind==='warn') tg.HapticFeedback.notificationOccurred('warning');
    else tg.HapticFeedback.impactOccurred(kind||'light');
  }catch(e){}
}

/* Liquid Glass: включаем только если браузер умеет современный CSS.
   На старых устройствах остаётся классический стиль без ошибок. */
const LG_OK = (window.CSS && CSS.supports && (CSS.supports('backdrop-filter','blur(2px)') || CSS.supports('-webkit-backdrop-filter','blur(2px)')) && CSS.supports('color','color-mix(in srgb, red 50%, blue)'));
if(LG_OK) document.documentElement.classList.add('lg');
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(new URLSearchParams(location.search).get('noanim')==='1'){ // служебное: мгновенные анимации для предпросмотра
  const st = document.createElement('style');
  st.textContent = '*{transition-duration:0s!important;animation-duration:0s!important;animation-delay:0s!important}';
  document.head.appendChild(st);
}

/* динамическое освещение карточек — только мышь на десктопе */
const IS_TOUCH = navigator.maxTouchPoints > 0;
if(LG_OK && !REDUCED && !IS_TOUCH){
  let raf = null;
  document.addEventListener('pointermove', (e)=>{
    if(e.pointerType === 'touch') return;
    if(raf) return;
    raf = requestAnimationFrame(()=>{
      raf = null;
      const el = e.target && e.target.closest ? e.target.closest('.card, .action-btn, .metric-card, .stat-card') : null;
      if(!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', Math.round((e.clientX-r.left)/r.width*100)+'%');
      el.style.setProperty('--my', Math.round((e.clientY-r.top)/r.height*100)+'%');
    });
  }, {passive:true});
  /* плавное затухание glow при уходе курсора */
  document.addEventListener('pointerleave', (e)=>{
    if(e.pointerType==='touch') return;
    document.querySelectorAll('.card, .action-btn').forEach(el=>el.style.removeProperty('--glow-op'));
  }, {passive:true});
}

/* ================= Иконки (монохром, currentColor) ================= */
function ic(name, sw){
  const P = {
    home:'<path d="M3 11.2 12 4l9 7.2"/><path d="M5.5 9.8V20h13V9.8"/>',
    food:'<path d="M7 3v5.5"/><path d="M4.3 3v3.5a2.7 2.7 0 0 0 5.4 0V3"/><path d="M7 11.5V21"/><path d="M17.5 3c-1.9.6-3 2.6-3 5.5 0 2.2.9 3.5 2 3.5V21"/><path d="M17.5 3v18" opacity=".001"/>',
    flame:'<path d="M12 2.8c1.2 3.4-3.6 5.2-3.6 9a4.9 4.9 0 0 0 9.8.4c.3-4-3.8-5.6-6.2-9.4z"/><path d="M10.4 14.5c-.5 1.8.6 3.3 2.1 3.5"/>',
    chart:'<path d="M4.5 20v-7"/><path d="M10.2 20V5"/><path d="M15.9 20v-4.5"/><path d="M21 20H3" opacity=".5"/>',
    gear:'<circle cx="12" cy="12" r="3.1"/><path d="M12 2.9v2.8M12 18.3v2.8M21.1 12h-2.8M5.7 12H2.9M18.4 5.6l-2 2M7.6 16.4l-2 2M18.4 18.4l-2-2M7.6 7.6l-2-2"/>',
    drop:'<path d="M12 3s6 6.6 6 10.8a6 6 0 0 1-12 0C6 9.6 12 3 12 3z"/>',
    dumbbell:'<path d="M7 6.5v11M17 6.5v11M3.8 9v6M20.2 9v6M7 12h10"/>',
    scale:'<circle cx="12" cy="12" r="8.6"/><path d="M12 12l3.2-3.6"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
    info:'<circle cx="12" cy="12" r="8.8"/><path d="M12 11v5.4"/><circle cx="12" cy="7.8" r="1.15" fill="currentColor" stroke="none"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    bolt:'<path d="M13.4 2.6 5.6 13h4.5l-1.7 8 8.6-12h-4.6l1-6.4z"/>',
    walk:'<circle cx="13" cy="4.4" r="1.7"/><path d="M12.5 8.5 9 21M12.5 8.5l3 3.5 3 1M12.5 8.5 9.5 11l-1 4M9 15.5 6.5 21"/>',
    shoe:'<path d="M2.8 18h18.4v-1.2c0-1.4-1-2.6-2.4-2.9l-4.6-1-2.8-3.2c-.4 1-1.4 1.6-2.5 1.4l-1.6-.3c-.5 1.3-1.8 2.2-3.2 2.2H2.8v5z"/><path d="M2.8 15.4h18.4"/><path d="M12 12.2l1 1.1M14.2 11.7l1 1.1"/>',
    download:'<path d="M12 3.5v10M8 9.5l4 4 4-4"/><path d="M4.5 17v3.5h15V17"/>',
    upload:'<path d="M12 13.5v-10M8 7.5l4-4 4 4"/><path d="M4.5 17v3.5h15V17"/>',
    restore:'<path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 3.5V7h3.5"/>',
    trash:'<path d="M4.5 7h15M10 7V5h4v2M6.5 7l.9 13h9.2l.9-13"/>',
    snow:'<path d="M12 3v18M5 7.5l14 9M19 7.5l-14 9"/>',
    history:'<circle cx="12" cy="12" r="8.6"/><path d="M12 7.5V12l3 2.2"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.9}" stroke-linecap="round" stroke-linejoin="round">${P[name]||''}</svg>`;
}

/* ================= Хранение и синхронизация =================
   Данные принадлежат ТЕЛЕГРАМ-АККАУНТУ, а не устройству:
   — CloudStorage Telegram — единое хранилище аккаунта, одинаковое на всех
     устройствах (телефон, десктоп, планшет). Ключ localStorage тоже содержит
     id пользователя, поэтому чужой аккаунт на том же ноутбуке не видит и не
     затирает твои данные.
   — состояния НЕ перезаписывают друг друга: они сливаются по элементам
     (день + запись + метка времени). Поэтому запись с одного устройства
     физически не может стереть день, добавленный на другом.
   — если облако не ответило, приложение НИКОГДА не пишет в него своё пустое
     состояние (именно из-за этого раньше терялся день при входе с нового
     устройства).
   Значения CloudStorage ограничены 4096 символами — режем на части. */
const CS_CHUNK = 3500, CS_MAX = 200;
const TG_UID = (function(){ try{ return (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) ? String(tg.initDataUnsafe.user.id) : ''; }catch(e){ return ''; } })();
const LS_KEY = TG_UID ? ('charge_v2_u' + TG_UID) : 'charge_v2';

function csGetChunk(keys){ return new Promise(res=>{ try{ tg.CloudStorage.getItems(keys,(e,v)=>res(e?null:v)); }catch(_){ res(null); } }); }
/* CloudStorage не любит длинные списки ключей — читаем порциями; null = сбой чтения */
async function csGetItems(keys){
  const out = {};
  for(let i=0;i<keys.length;i+=40){
    const part = await csGetChunk(keys.slice(i,i+40));
    if(!part) return null;
    Object.assign(out, part);
  }
  return out;
}
function csSetItem(k,v){ return new Promise(res=>{ try{ tg.CloudStorage.setItem(k,v,(e,ok)=>res(!e&&ok!==false)); }catch(_){ res(false); } }); }
function csRemoveItems(keys){ return new Promise(res=>{ try{ tg.CloudStorage.removeItems(keys,()=>res(true)); }catch(_){ res(false); } }); }

function clone(x){ try{ return x==null? x : JSON.parse(JSON.stringify(x)); }catch(e){ return x; } }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- слияние состояний (коммутативно: результат не зависит от порядка) ---------- */
function itemKey(it){ return it && (it.id || ((it.time||'') + '|' + (it.name||it.label||'') + '|' + (it.kcal||0))); }
function mergeItemLogs(a, b, tomb){
  const out = {};
  const dates = new Set(Object.keys(a||{}).concat(Object.keys(b||{})));
  dates.forEach(d=>{
    const map = new Map();
    const put = (it)=>{
      const k = itemKey(it);
      if(!k) return;
      const prev = map.get(k);
      if(!prev || (it.upd||0) > (prev.upd||0)) map.set(k, it);
    };
    (a && a[d] || []).forEach(put);
    (b && b[d] || []).forEach(put);
    const list = [];
    map.forEach((it,k)=>{ const id = it.id || k; if(!(tomb && tomb[id])) list.push(it); });
    list.sort((x,y)=> String(x.time||'').localeCompare(String(y.time||'')));
    if(list.length) out[d] = list; else if((a&&a[d]) || (b&&b[d])) out[d] = [];
  });
  return out;
}
function mergeNumLog(a, b, sa, sb, prefix){
  const out = {};
  const keys = new Set(Object.keys(a||{}).concat(Object.keys(b||{})));
  keys.forEach(d=>{
    const ta = (sa && sa[prefix+d]) || 0, tb = (sb && sb[prefix+d]) || 0;
    let v;
    if(tb > ta) v = (b||{})[d];
    else if(ta > tb) v = (a||{})[d];
    else v = Math.max((a||{})[d]||0, (b||{})[d]||0); /* метки равны — берём большее значение, ничего не теряем */
    if(v!=null) out[d] = v;
  });
  return out;
}
function mergeWeights(a, b, sa, sb){
  const map = new Map();
  (a||[]).forEach(e=> map.set(e.date, e));
  (b||[]).forEach(e=>{
    const cur = map.get(e.date);
    if(!cur){ map.set(e.date, e); return; }
    const ta = (sa && sa['weight:'+e.date]) || 0, tb = (sb && sb['weight:'+e.date]) || 0;
    if(tb > ta) map.set(e.date, e);
  });
  return Array.from(map.values()).sort((x,y)=>x.date.localeCompare(y.date));
}
function mergeCustomFoods(a, b, tomb){
  const map = new Map();
  const put = (f)=>{
    const k = f.id || ('n:' + String(f.name||'').toLowerCase());
    const prev = map.get(k);
    if(!prev || (f.upd||0) > (prev.upd||0)) map.set(k, f);
  };
  (a||[]).forEach(put); (b||[]).forEach(put);
  const out = [];
  map.forEach((f,k)=>{ if(!(tomb && tomb[f.id || k])) out.push(f); });
  return out;
}
function mergeFreq(a, b){
  const out = {};
  const keys = new Set(Object.keys(a||{}).concat(Object.keys(b||{})));
  keys.forEach(k=>{
    const x = (a||{})[k], y = (b||{})[k];
    if(!x){ out[k] = y; return; }
    if(!y){ out[k] = x; return; }
    out[k] = {
      n: Math.max(x.n||0, y.n||0),
      last: (String(x.last||'') >= String(y.last||'')) ? x.last : y.last,
      food: (x.n||0) >= (y.n||0) ? x.food : y.food
    };
  });
  return out;
}
function mergeStates(a, b){
  if(!a) return clone(b);
  if(!b) return clone(a);
  const sa = a.stamps || {}, sb = b.stamps || {};
  const out = {};
  const newer = (k)=> ((sb[k]||0) > (sa[k]||0)) ? b : a; /* при равных метках приоритет у первого (локального) */
  ['profile','theme','goalShown'].forEach(k=>{ out[k] = clone(newer(k)[k]); });
  out.stamps = {};
  Object.keys(sa).concat(Object.keys(sb)).forEach(k=>{ out.stamps[k] = Math.max(sa[k]||0, sb[k]||0); });
  out.tomb = {};
  Object.keys(a.tomb||{}).concat(Object.keys(b.tomb||{})).forEach(k=>{ out.tomb[k] = Math.max((a.tomb||{})[k]||0, (b.tomb||{})[k]||0); });
  out.foodLog = mergeItemLogs(a.foodLog, b.foodLog, out.tomb);
  out.workoutLog = mergeItemLogs(a.workoutLog, b.workoutLog, out.tomb);
  out.waterLog = mergeNumLog(a.waterLog, b.waterLog, sa, sb, 'water:');
  out.stepsLog = mergeNumLog(a.stepsLog, b.stepsLog, sa, sb, 'steps:');
  out.weightLog = mergeWeights(a.weightLog, b.weightLog, sa, sb);
  out.customFoods = mergeCustomFoods(a.customFoods, b.customFoods, out.tomb);
  out.foodFreq = mergeFreq(a.foodFreq, b.foodFreq);
  out.uid = a.uid || b.uid || '';
  out.savedAt = Math.max(a.savedAt||0, b.savedAt||0);
  return out;
}

function contentSig(st){

/* ---------- чтение облака ---------- */
let _csGen = 'A', _cloudHadProfile = false, _lastProfileJson = '', _cloudReadOK = false;
async function readGen(metaVal){
  const [gen, nStr, lenStr] = String(metaVal||'').split(':');
  const n = parseInt(nStr)||0, len = parseInt(lenStr)||0;
  if(!(gen==='A'||gen==='B') || !(n>0 && n<=CS_MAX)) return {ok:false, state:null};
  const keys = Array.from({length:n},(_,i)=>'cs'+gen+'_'+i);
  const parts = await csGetItems(keys);
  if(!parts) return {ok:false, state:null};
  const json = keys.map(k=>parts[k]||'').join('');
  if(!json || (len && json.length!==len)) return {ok:false, state:null};
  try{ const st = JSON.parse(json); _csGen = gen; return {ok:true, state:st}; }catch(e){ return {ok:false, state:null}; }
}
/* {ok:true, state:null} = облако точно пустое; {ok:false} = прочитать не удалось */
async function cloudRead(){
  try{
    const meta = await csGetItems(['cs2_meta','cs2_meta_prev','cs_meta']);
    if(!meta) return {ok:false, state:null};
    if(meta.cs2_meta){
      const r = await readGen(meta.cs2_meta);
      if(r.ok) return r;
      if(meta.cs2_meta_prev){ /* текущая копия побилась — берём предыдущую целую */
        const p = await readGen(meta.cs2_meta_prev);
        if(p.ok) return p;
      }
      return {ok:false, state:null};
    }
    if(meta.cs_meta){ /* старый формат — совместимость */
      const n = parseInt(meta.cs_meta)||0;
      if(n>0 && n<=60){
        const keys = Array.from({length:n},(_,i)=>'cs_'+i);
        const parts = await csGetItems(keys);
        if(!parts) return {ok:false, state:null};
        const json = keys.map(k=>parts[k]||'').join('');
        if(json){ try{ return {ok:true, state:JSON.parse(json)}; }catch(e){ return {ok:false, state:null}; } }
      }
      return {ok:false, state:null};
    }
    return {ok:true, state:null};
  }catch(e){ return {ok:false, state:null}; }
}

function readLocal(){
  let local = null;

  if(local && local.uid && TG_UID && local.uid !== TG_UID) local = null;
  return local;
}

let _snap = null;
function snapshot(st){
  return {
    profile: JSON.stringify(st.profile||null),
    theme: JSON.stringify(st.theme||null),
    goalShown: JSON.stringify(!!st.goalShown),

    workoutLog: JSON.stringify(st.workoutLog||{}),
    customFoods: JSON.stringify(st.customFoods||[])
  };

function stampItemLog(logName, prev, t){
  const log = S[logName] || {};
  const prevIds = new Set();
  /* «Надгробия» ставим ТОЛЬКО для записей с уже существующим стабильным id.
     Раньше сюда попадали составные ключи старых записей (без id): при миграции
     записи получали новые id, старые ключи считались удалёнными — и те же самые
     записи стирались на другом устройстве при слиянии */
  Object.keys(prev||{}).forEach(d=> (prev[d]||[]).forEach(it=>{ if(it && it.id) prevIds.add(it.id); }));
  const prevById = {};
  Object.keys(prev||{}).forEach(d=> (prev[d]||[]).forEach(it=>{ const k = itemKey(it); if(k) prevById[k] = it; }));
  const nowIds = new Set();
  Object.keys(log).forEach(d=>{
    (log[d]||[]).forEach(it=>{
      if(!it.id) it.id = newId();
      const old = prevById[it.id];
      if(!old){ it.upd = t; }
      else {
        const a = Object.assign({}, it); delete a.upd;
        const b = Object.assign({}, old); delete b.upd;
        it.upd = (JSON.stringify(a) !== JSON.stringify(b)) ? t : (old.upd || t);
      }
      nowIds.add(it.id);
    });
  });
  /* исчезло локально → это удаление: помечаем, чтобы запись не «вернулась» из облака */
  prevIds.forEach(id=>{ if(!nowIds.has(id)) S.tomb[id] = t; });
}
function autoStamp(){
  const t = Date.now();
  S.stamps = S.stamps || {}; S.tomb = S.tomb || {};
  const cur = snapshot(S);
  const prev = _snap;
  ['profile','theme','goalShown'].forEach(k=>{ if(!prev || prev[k]!==cur[k]) S.stamps[k] = t; });
  ['waterLog','stepsLog'].forEach(k=>{
    if(prev && prev[k]===cur[k]) return;
    const before = prev ? JSON.parse(prev[k]) : {};
    const now = S[k] || {};
    const pref = (k==='waterLog') ? 'water:' : 'steps:';
    new Set(Object.keys(before).concat(Object.keys(now))).forEach(d=>{ if(before[d]!==now[d]) S.stamps[pref+d] = t; });
  });
  if(!prev || prev.weightLog!==cur.weightLog){
    const before = {}; (prev? JSON.parse(prev.weightLog) : []).forEach(e=> before[e.date] = e.weight);
    (S.weightLog||[]).forEach(e=>{ if(before[e.date]!==e.weight) S.stamps['weight:'+e.date] = t; });
  }
  if(!prev || prev.customFoods!==cur.customFoods){
    const before = (prev? JSON.parse(prev.customFoods) : []);
    const beforeIds = new Set(before.filter(f=>f.id).map(f=>f.id));
    const nowIds = new Set();
    (S.customFoods||[]).forEach(f=>{ if(!f.id) f.id = newId(); if(!beforeIds.has(f.id)) f.upd = t; nowIds.add(f.id); });
    beforeIds.forEach(id=>{ if(!nowIds.has(id)) S.tomb[id] = t; });
  }
  if(!prev || prev.foodLog!==cur.foodLog) stampItemLog('foodLog', prev? JSON.parse(prev.foodLog) : {}, t);
  if(!prev || prev.workoutLog!==cur.workoutLog) stampItemLog('workoutLog', prev? JSON.parse(prev.workoutLog) : {}, t);
  /* чистим старые «надгробия» — они нужны только пока их могут не увидеть другие устройства */
  const cutTs = t - 120*86400000;
  Object.keys(S.tomb).forEach(id=>{ if((S.tomb[id]||0) < cutTs) delete S.tomb[id]; });
}

let _saveTimer = null, _csSaving = false, _csPending = false;
function save(now){ clearTimeout(_saveTimer); _saveTimer = setTimeout(doSave, now?0:400); }
function pruneHistory(){
  /* если данные разрослись — держим последние 180 дней и 250 частых продуктов */
  const cut = todayStr(new Date(Date.now()-180*86400000));
  [S.foodLog, S.waterLog, S.stepsLog, S.workoutLog].forEach(log=>{ if(log) Object.keys(log).forEach(d=>{ if(d<cut) delete log[d]; }); });
  if(Array.isArray(S.weightLog) && S.weightLog.length){
    /* чистим и историю веса, но последнюю запись всегда сохраняем (нужна для цели и аналитики) */
    const sorted = [...S.weightLog].sort((a,b)=> String(a.date).localeCompare(String(b.date)));
    const lastW = sorted[sorted.length-1];
    S.weightLog = S.weightLog.filter(w=> w.date>=cut || w===lastW);
  }
  delete S.accessCache; /* легаси: раньше кэш доступа лежал в состоянии — вычищаем */
  const keys = Object.keys(S.foodFreq||{});
  if(keys.length>250){
    keys.sort((a,b)=> String(S.foodFreq[b].last||'').localeCompare(String(S.foodFreq[a].last||'')));
    keys.slice(250).forEach(k=> delete S.foodFreq[k]);
  }
}
function saveLocal(json){ try{ localStorage.setItem(LS_KEY, json); }catch(e){} }
async function doSave(){
  autoStamp();
  S.uid = S.uid || TG_UID || '';
  S.savedAt = Date.now();
  let json = '';
  try{ json = JSON.stringify(S); }catch(e){ return; }
  saveLocal(json);
  _snap = snapshot(S);
  if(!cloudOK) return;
  if(_csSaving){ _csPending = true; return; }
  _csSaving = true;
  try{
    /* 1) сначала читаем облако и сливаем с локальным — параллельная работа с двух
          устройств не теряется, а объединяется */
    const r = await cloudRead();
    if(r.ok){
      _cloudReadOK = true;
      if(r.state && (!r.state.uid || !TG_UID || r.state.uid===TG_UID)){
        S = mergeStates(S, r.state);
        if(r.state.profile) _cloudHadProfile = true;
      }
    } else if(!_cloudReadOK){
      /* облако недоступно и мы ни разу его не прочитали — не перезаписываем вслепую */
      _csSaving = false;
      if(_csPending){ _csPending = false; }
      return;
    }
    if(!S.profile && _cloudHadProfile){ _csSaving = false; return; }
    S.uid = TG_UID || S.uid || '';
    S.savedAt = Date.now();
    json = JSON.stringify(S);
    if(json.length > CS_CHUNK*CS_MAX){ pruneHistory(); S.savedAt = Date.now(); json = JSON.stringify(S); }
    saveLocal(json);
    _snap = snapshot(S);
    /* 2) пишем в НЕАКТИВНУЮ генерацию и переключаем мету только после успеха всех
          кусков — прошлая целая копия всегда остаётся как резерв */
    const gen = _csGen==='A' ? 'B' : 'A';
    const n = Math.max(1, Math.ceil(json.length/CS_CHUNK));
    let ok = n<=CS_MAX;
    for(let i=0; i<n && ok; i++){
      const chunk = json.slice(i*CS_CHUNK,(i+1)*CS_CHUNK);
      let res = await csSetItem('cs'+gen+'_'+i, chunk);
      if(!res) res = await csSetItem('cs'+gen+'_'+i, chunk); /* один повтор */
      ok = ok && res;
    }
    if(ok){
      const oldMeta = (await csGetItems(['cs2_meta'])) || {};
      if(oldMeta.cs2_meta) await csSetItem('cs2_meta_prev', oldMeta.cs2_meta);
      if(await csSetItem('cs2_meta', gen+':'+n+':'+json.length+':'+S.savedAt)) _csGen = gen;
    }
    if(S.profile){
      const pj = JSON.stringify(S.profile);
      if(pj !== _lastProfileJson && pj.length < 4000 && await csSetItem('cs_profile', pj)) _lastProfileJson = pj;
      _cloudHadProfile = true;
    }
  }catch(e){}
  _csSaving = false;
  if(_csPending){ _csPending = false; save(true); }
}
/* сбрасываем отложенное сохранение при сворачивании — иначе последние действия терялись.
   visibilitychange(hidden) и pagehide могут прийти почти одновременно — схлопываем в один флеш,
   чтобы не запускать 2–3 параллельные записи в CloudStorage (гонка генераций A/B и рейт-лимиты Telegram) */
let _flushingSave = false;

}

let _syncBusy = false;
async function syncFromCloud(){

  if(window._swipeBusy) return; /* не дёргаем экран во время жеста */
  const so = document.getElementById('sheetOverlay'), mo = document.getElementById('modalOverlay');
  if((so && so.classList.contains('open')) || (mo && mo.classList.contains('open'))) return;
  _syncBusy = true;
  try{
    const r = await cloudRead();
    if(r.ok){
      _cloudReadOK = true;
      const remote = r.state;
      if(remote && (!remote.uid || !TG_UID || remote.uid===TG_UID)){
        if(remote.profile) _cloudHadProfile = true;
        const before = contentSig(S);
        const merged = mergeStates(S, remote);
        const after = contentSig(merged);
        if(after !== before){
          const hadProfile = !!S.profile;
          S = merged;
          saveLocal(JSON.stringify(S));
          _snap = snapshot(S);
          applyTheme();
          if(S.profile && !hadProfile && typeof renderMain==='function') renderMain();
          else if(S.profile && typeof renderTab==='function') renderTab();
        }
        /* у нас есть то, чего нет в облаке — отправляем */
        if(contentSig(merged) !== contentSig(remote)) save(true);
      } else if(!remote && S.profile){
        save(true); /* облако пустое, а данные есть — заливаем */
      }
    }
  }catch(e){}
  _syncBusy = false;
}

/* ---- Open Food Facts (открытая база, без ключа; при офлайне — локальная база) ---- */
function offToFood(prod){
  const n = prod.nutriments || {};
  const numOr = (...keys)=>{ for(const k of keys){ const v = n[k]; if(v!=null && isFinite(v)) return +v; } return null; };
  const pr = numOr('proteins_100g','proteins') ?? 0;
  const cb = numOr('carbohydrates_100g','carbohydrates') ?? 0;
  const ft = numOr('fat_100g','fat') ?? 0;
  let kcal = numOr('energy-kcal_100g','energy-kcal');
  /* у многих европейских товаров заполнены только кДж — раньше такие продукты
     просто выбрасывались и выглядело это как «продукт не найден» */
  if(kcal==null){ const kj = numOr('energy_100g','energy-kj_100g','energy'); if(kj!=null && kj>0) kcal = kj/4.184; }
  /* крайний случай: считаем калорийность из БЖУ */
  if(kcal==null && (pr || cb || ft)) kcal = pr*4 + cb*4 + ft*9;
  if(kcal==null || kcal<0 || kcal>1000) return null;
  let name = String(prod.product_name_ru || prod.product_name || prod.product_name_en || prod.generic_name_ru || prod.generic_name || '')
    .replace(/[\u0000-\u001F\u007F\uFFFD]/g,' ')   // управляющие и «битые» символы
    .replace(/\s+/g,' ').trim();
  const brand = prod.brands ? String(prod.brands).split(',')[0].trim() : '';
  /* у части товаров заполнен только бренд — лучше показать его, чем ничего */
  if(!name) name = brand;
  if(name.length>70) name = name.slice(0,70).trim()+'…';
  if(!name) return null;
  let na = null;
  if(n.sodium_100g!=null) na = n.sodium_100g*1000;
  else if(n.salt_100g!=null) na = n.salt_100g*400;
  const k = n.potassium_100g!=null ? n.potassium_100g*1000 : null;
  const withBrand = brand && !normFoodStr(name).includes(normFoodStr(brand)) ? `${name} — ${brand}` : name;
  return { name: withBrand, emoji:'🍽', off:true, code: prod.code || null,
    per100:{ kcal:Math.round(kcal), p:r1(pr), c:r1(cb), f:r1(ft),
      na: na!=null? Math.round(na): null, k: k!=null? Math.round(k): null } };
}
async function offFetchJson(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const res = await fetch(url, { signal: ctl.signal });
    if(!res.ok) throw new Error('http '+res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}
/* Несколько зеркал сразу: ru-зеркало знает русские названия, world — больше товаров,
   а search-сервис даёт лучшую релевантность. Любой из них регулярно отваливается,
   поэтому спрашиваем все параллельно и берём всё, что успело ответить */
const OFF_HOSTS = ['https://ru.openfoodfacts.org', 'https://world.openfoodfacts.org'];
const OFF_FIELDS = 'code,product_name,product_name_ru,product_name_en,generic_name,generic_name_ru,brands,nutriments';
async function searchOpenFoodFacts(query){
  const variants = offQueryVariants(query);
  if(!variants.length) return [];
  const urls = [];
  variants.forEach((q, qi)=>{
    const enc = encodeURIComponent(q);
    urls.push('https://search.openfoodfacts.org/search?q='+enc+'&langs=ru,en&page_size=25&fields='+OFF_FIELDS);
    urls.push('https://ru.openfoodfacts.org/cgi/search.pl?search_terms='+enc+'&search_simple=1&action=process&json=1&page_size=25&lc=ru&fields='+OFF_FIELDS);
    /* world дёргаем только для основного варианта запроса, чтобы не получить бан по частоте */
    if(qi===0) urls.push('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+enc+'&search_simple=1&action=process&json=1&page_size=25&lc=ru&fields='+OFF_FIELDS);
  });
  const settled = await Promise.allSettled(urls.map(u=>offFetchJson(u, 9000)));
  const out = [], seen = new Set();
  let anyOk = false;
  for(const r of settled){
    if(r.status!=='fulfilled' || !r.value) continue;
    anyOk = true;
    const arr = r.value.hits || r.value.products || [];
    for(const prod of arr){
      const f = offToFood(prod);
      if(!f) continue;
      const key = normFoodStr(f.name);
      if(!key || seen.has(key)) continue;
      seen.add(key); out.push(f);
    }
  }
  if(!anyOk) throw new Error('network');
  return out;
}
/* Штрихкод может лежать в базе в другой форме: UPC-A без ведущего нуля, EAN-8,
   код с лишним нулём слева. Из-за этого реально существующие товары раньше не находились */
function barcodeVariants(code){
  const c = String(code||'').replace(/\D/g,'');
  if(c.length < 6) return [];
  const v = [c];
  const add = x=>{ if(x && v.indexOf(x)<0) v.push(x); };
  if(c.length===12) add('0'+c);
  if(c.length===13 && c[0]==='0') add(c.slice(1));
  if(c.length===8){ add(c.replace(/^0+/,'')); add(c.padStart(13,'0')); }
  if(c.length<13) add(c.padStart(13,'0'));
  return v.slice(0,4);
}
async function lookupBarcodeOFF(code){
  const codes = barcodeVariants(code);
  if(!codes.length) return { ok:false, reason:'badcode' };
  const reqs = [];
  codes.forEach((c, ci)=>{
    for(const host of OFF_HOSTS) reqs.push(host+'/api/v2/product/'+c+'.json?fields='+OFF_FIELDS+',status');
    /* старый v0 иногда отдаёт товар, который v2 не видит */
    if(ci===0) reqs.push('https://world.openfoodfacts.org/api/v0/product/'+c+'.json');
  });
  const settled = await Promise.allSettled(reqs.map(u=>offFetchJson(u, 9000)));
  let anyOk = false, foundName = '';
  for(const r of settled){
    if(r.status!=='fulfilled' || !r.value) continue;
    anyOk = true;
    const prod = r.value.product;
    if(!prod) continue;
    const f = offToFood(prod);
    if(f) return { ok:true, food:f };
    /* карточка есть, но КБЖУ никто не заполнил — честно скажем об этом */
    if(!foundName) foundName = String(prod.product_name_ru || prod.product_name || prod.brands || '').trim();
  }
  if(!anyOk) throw new Error('network');
  if(foundName) return { ok:false, reason:'nodata', name:foundName };
  return { ok:false, reason:'notfound' };
}

async function publishFood(food){
  if(!publicDbReady()) return false;
  /* Клиентская валидация + троттлинг. ВНИМАНИЕ: это НЕ защита — anon-ключ виден в клиенте.
     Реальню защиту от мусора должны обеспечивать RLS-политика и валидация в edge-функции на сервере. */
  const name = String(food.name||'').trim();
  const per = food.per100 || {};
  const numOk = (x, max)=> x==null || (typeof x==='number' && isFinite(x) && x>=0 && x<=max);
  if(name.length < 2 || name.length > 80){ showToast('Название: 2–80 символов'); return false; }
  if(!numOk(per.kcal,1000) || !numOk(per.p,100) || !numOk(per.c,100) || !numOk(per.f,100) || !numOk(per.na,20000) || !numOk(per.k,20000)){
    showToast('Проверь значения на 100 г'); return false;
  }
  try{ const last = +(localStorage.getItem('cf_pub_ts')||0); if(Date.now()-last < 20000){ showToast('Слишком часто — подожди немного'); return false; } }catch(e){}
  try{
    const res = await fetch(PUBLIC_DB.url+'/rest/v1/public_foods',
      { method:'POST',
        headers:{ apikey:PUBLIC_DB.key, Authorization:'Bearer '+PUBLIC_DB.key, 'Content-Type':'application/json', Prefer:'return=minimal' },
        body: JSON.stringify({ name:name, emoji:food.emoji||'🍽', kcal:per.kcal,
          p:per.p||0, c:per.c||0, f:per.f||0, na:per.na, k:per.k }) });
    if(!res.ok) return false;
    try{ localStorage.setItem('cf_pub_ts', String(Date.now())); }catch(e){}
    PUBLIC_FOODS.unshift(Object.assign({}, food, {pub:true}));
    return true;
  }catch(e){ return false; }
}

/* ================= Калории и расчёты ================= */
/* базовый обмен — формула Миффлина-Сан Жеора */
function bmr(p){ const base = 10*p.weight + 6.25*p.height - 5*p.age;
  return p.gender==='male' ? base + 5 : base - 161; }
const ACTIVITY_MULT = { min:1.2, low:1.375, medium:1.55, high:1.725, athlete:1.9 };
function tdee(p){ return bmr(p) * (ACTIVITY_MULT[p.activity] || 1.375); }
/* дефицит в процентах от нормы */
const GOAL_PCT = { maintain:0, slow:0.10, moderate:0.20, fast:0.28 };
/* ручной режим: норма КБЖУ задана в настройках — тогда всё, что зависит от нормы
   (кольцо, остаток, белок, календарь, аналитика, графики, прогноз и советы)
   считается от его чисел, а не от формулы */
function customOn(p){ return !!(p && p.custom && p.custom.on && p.custom.kcal > 0); }
function goalRateKgWeek(p){
  if(customOn(p)) return Math.round((tdee(p) - goalCalories(p))*7/7700*20)/20;
  return Math.round(tdee(p)*(GOAL_PCT[p.goal]||0)*7/7700*20)/20;
}
function goalCalories(p){
  if(customOn(p)) return Math.round(p.custom.kcal);
  const t = tdee(p)*(1-(GOAL_PCT[p.goal]||0)) + (p.calorieAdjust||0); return Math.round(t/10)*10;
}
/* умные нормы БЖУ: при большом лишнем весе белок/жир считаем от «расчётного» веса
   (норма BMI 22 + четверть избытка), а не от фактического — жировая масса белок не требует.
   Углеводы — из остатка калорий, но не меньше 10% нормы */
function leanRefWeight(p){
  const ideal = 22 * Math.pow(p.height/100, 2);
  return p.weight <= ideal ? p.weight : Math.round(ideal + (p.weight-ideal)*0.25);
}
function autoMacroTargets(p){
  const kcal = goalCalories(p);
  const ref = leanRefWeight(p);
  const protein = Math.round(ref*1.8);
  let fat = Math.max(Math.round(ref*0.8), 40);
  let carbs = Math.round((kcal - protein*4 - fat*9)/4);
  const minCarbs = Math.round(kcal*0.10/4);
  if(carbs < minCarbs){ carbs = minCarbs; fat = Math.max(40, Math.round((kcal - protein*4 - carbs*4)/9)); }
  return { protein, fat, carbs: Math.max(carbs, 0) };
}
function macroTargets(p){
  if(customOn(p)){
    const c = p.custom, auto = autoMacroTargets(p);
    return {
      protein: c.p>0 ? Math.round(c.p) : auto.protein,
      fat:     c.f>0 ? Math.round(c.f) : auto.fat,
      carbs:   c.c>0 ? Math.round(c.c) : auto.carbs
    };
  }
  return autoMacroTargets(p);
}

function dayItems(ds){ return S.foodLog[ds] || []; }
function dayTotal(ds){ return Math.round(dayItems(ds).reduce((s,i)=>s+(i.kcal||0),0)); }
function dayMacro(ds,key){ return Math.round(dayItems(ds).reduce((s,i)=>s+(i[key]||0),0)); }
/* натрий/калий считаем ТОЛЬКО по продуктам с реальными данными — выдумывать нельзя */
function naItems(ds){ return dayItems(ds).filter(i=>i.na!=null); }
function kItems(ds){ return dayItems(ds).filter(i=>i.k!=null); }
function dayNa(ds){ return Math.round(naItems(ds).reduce((s,i)=>s+i.na,0)); }
function dayK(ds){ return Math.round(kItems(ds).reduce((s,i)=>s+i.k,0)); }
/* покрытие данными: none — ни у одного продукта нет na/k; partial — есть не у всех; full — есть у всех */
function nkCoverage(ds){ const items=dayItems(ds); if(!items.length) return 'none';
  const withData=items.filter(i=>i.na!=null||i.k!=null); if(!withData.length) return 'none';
  return withData.length<items.length ? 'partial' : 'full'; }
function daySalt(ds){ return r1(dayNa(ds)*2.5/1000); }
const SALT_LIMIT = 4.5;
function dayWater(ds){ return S.waterLog[ds] || 0; }
function waterNormMl(){ if(!S.profile) return 2000; const per = S.profile.gender==='female' ? 30 : 35; return Math.round(S.profile.weight*per/50)*50; }
function workoutsKcal(ds){ return Math.round((S.workoutLog[ds]||[]).reduce((s,w)=>s+(w.kcal||0),0)); }
function stepsKcal(ds){ const w = S.profile ? S.profile.weight : 70; return Math.round(daySteps(ds) * w * 0.00038); } // ~0.38 ккал на 1000 шагов на кг веса
function dayBurned(ds){ return workoutsKcal(ds) + stepsKcal(ds); }
function daySteps(ds){ return S.stepsLog[ds] || 0; }
const STEPS_GOAL = 10000;
function activityRating(ds){
  const score = daySteps(ds)/STEPS_GOAL + workoutsKcal(ds)/350;
  if(score>=0.9) return {label:'Отличная', color:'#7be08a'};
  if(score>=0.45) return {label:'Умеренная', color:'#ffc247'};
  return {label:'Слабая', color:'#ff8a80'};
}
function dayDeficit(ds){ /* истинный дефицит: съедено − расход. Активность уже заложена в коэффициент TDEE, поэтому dayBurned повторно не вычитаем. Отрицательное = дефицит */ return dayTotal(ds) - Math.round(tdee(S.profile)); }
function dayGoalDelta(ds){ /* отклонение от дневной цели: 0 = точно по плану. Активность уже учтена в норме через TDEE */ return dayTotal(ds) - goalCalories(S.profile); }

/* ---- стрик с заморозками (3 в месяц) ---- */
function streakInfo(){
  const frozen = new Set();
  const budget = {};
  const today = todayStr();
  const hasToday = dayItems(today).length>0;
  let count = hasToday ? 1 : 0;
  let pending = [];
  const d = new Date(); d.setDate(d.getDate()-1);
  for(let i=0;i<800;i++){
    const ds = todayStr(d);
    if(dayItems(ds).length>0){
      pending.forEach(x=>frozen.add(x)); pending = [];
      count++;
    } else {
      const m = ds.slice(0,7);
      budget[m] = (budget[m]||0)+1;
      if(budget[m]>3) break;
      pending.push(ds);
    }
    d.setDate(d.getDate()-1);
  }
  /* показываем только реально заработанные дни: сегодняшний день входит в стрик, лишь когда что-то съедено (count уже это учитывает) */
  const display = count;
  return { count, display, hasToday, frozen };
}

/* sheets & модалки */
function openSheet(html){
  const overlay = document.getElementById('sheetOverlay');
  const content = document.getElementById('sheetContent');
  if(!overlay || !content) return;
  content.innerHTML = '<button class="sheet-close" data-act="closeSheet" aria-label="Закрыть">✕</button>' + html;
  if(!overlay.classList.contains('open')) content.scrollTop = 0;
  overlay.classList.add('open');
  document.documentElement.classList.add('no-scroll');
  /* Свайп влево — закрыть шторку.
     #sheetContent не пересоздаётся между открытиями — снимаем предыдущие обработчики,
     иначе они накапливаются и свайп-закрытие срабатывает пачкой */
  if(content._swipeStart) content.removeEventListener('touchstart', content._swipeStart);
  if(content._swipeEnd) content.removeEventListener('touchend', content._swipeEnd);
  let sx = 0;
  const onTS = (e)=>{ sx = e.touches[0].clientX; };
  const onTE = (e)=>{
    if(e.changedTouches[0].clientX - sx > 80 && content.scrollTop < 5) closeSheet();
  };
  content._swipeStart = onTS;
  content._swipeEnd = onTE;
  content.addEventListener('touchstart', onTS, {passive:true});
  content.addEventListener('touchend', onTE, {passive:true});
}
function closeSheet(){ editDs = null;
  if(typeof stopScanner==='function') stopScanner();
  const overlay = document.getElementById('sheetOverlay');
  if(overlay) overlay.classList.remove('open');
  document.documentElement.classList.remove('no-scroll');
}
ACTIONS.closeSheet = closeSheet;

async function init(){
  const params = new URLSearchParams(location.search);
  try{
    const loaded = await storageLoad();
    if(loaded && typeof loaded==='object') S = Object.assign(S, loaded);
  }catch(e){}
  normalizeState();
  S.uid = TG_UID || S.uid || '';
  _snap = snapshot(S); /* базовая точка: дальше каждая правка получает свою метку времени */
  if(!S.profile && params.get('demo')==='1') seedDemo();
  /* миграция старых уровней активности на новую шкалу */
  if(S.profile && !S.profile.actV2){ const remap = {low:'min', medium:'low', high:'medium'}; if(remap[S.profile.activity]) S.profile.activity = remap[S.profile.activity]; S.profile.actV2 = 1; save(); }
  if(params.get('dark')==='1') S.theme.dark = true; // служебное: предпросмотр тёмной темы
  if(params.get('accent')) S.theme.accent = params.get('accent'); // служебное: предпросмотр акцента
  applyTheme();
  if(tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme);
  loadPublicFoods(); // подтягиваем общую базу продуктов в фоне, не блокируя старт
  const acc = await checkAccess();
  app.classList.add('appear');
  if(acc && acc.access==='expired'){ renderLock(acc.reason||'trial_over'); return; }
  if(acc && acc.access==='trial' && acc.daysLeft!=null) setTimeout(()=>showToast('Пробный период — осталось дней: '+acc.daysLeft), 800);
  if(!S.profile){ renderOnboarding(0); }
  else{
    const t = params.get('tab');
    if(t) ui.tab = t;
    renderMain();
    setTimeout(checkGoalReached, 400); /* если цель уже достигнута к моменту запуска — поздравляем сразу, не ждём новой записи веса */

    if(op){ setTimeout(()=>{ const fn = ACTIONS[op] || ACTIONS['open'+op.charAt(0).toUpperCase()+op.slice(1)]; if(fn) fn(); }, 150); }

}
